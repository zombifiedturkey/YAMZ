<style>
:root{
  --bg:#0c0d10; --bg2:#14161b; --bg3:#1c1f26; --line:#272b34;
  --text:#ecedf0; --text2:var(--text2); --muted:#9097a3; --dim:#646b77;
  --accent:#e8b04b; --acc-rgb:232,176,75; --on-accent:var(--on-accent); --accent-t:var(--accent);
  --accent2:#c7432f; --ok:#5fb57d;
  --hdr:rgba(12,13,16,.92); --ok-t:var(--ok-t); --bad-t:var(--bad-t); --up-t:var(--up-t); --net:#94c35c;
  --shadow:rgba(0,0,0,.45);
  --radius:10px; --side:240px; --ps:1; --pr:10px; --prs:8px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f2ee; --bg2:#ffffff; --bg3:#ebe9e3; --line:#dad6cd;
  --text:#1b1c20; --text2:#30333a; --muted:#5b616d; --dim:#8a8f99;
  --accent-t:color-mix(in srgb, var(--accent) 70%, #000);
  --hdr:rgba(243,242,238,.92); --ok-t:#2e7a49; --bad-t:#b1352a; --up-t:#3451a0; --net:#5a9429;
  --shadow:rgba(40,35,20,.16);
  color-scheme:light;
}
:root[data-theme="light"] .ph{color:rgba(255,255,255,.95)}
:root[data-theme="light"] .badge{background:rgba(255,255,255,.92)}
:root[data-theme="light"] .x{background:rgba(0,0,0,.45)}
body{transition:background .25s,color .25s}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent-t)}
.bebas{font-family:"Bebas Neue",Impact,sans-serif;letter-spacing:.04em;font-weight:400}

/* header */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--hdr);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-size:32px;line-height:1;color:var(--accent-t);white-space:nowrap;display:flex;align-items:center;gap:10px}
.logo .net{color:var(--net)}
.zicon{width:40px;height:40px;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.55));transition:transform .3s}
.logo:hover .zicon{transform:rotate(-8deg) scale(1.06)}
.logo .lockup{display:flex;flex-direction:column;gap:3px}
.logo .lockup small{font-size:9.5px;letter-spacing:.16em;margin-left:2px}
.logo small{font-family:Inter;font-size:11px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
.tabs{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:6px 16px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.tabs button.on{background:var(--accent);color:var(--on-accent)}
.search{flex:1;max-width:420px;position:relative}
.search input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 36px;outline:none}
.search input:focus{border-color:var(--accent-t)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--dim)}
.hbtn{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.hbtn:hover{border-color:var(--accent-t);color:var(--accent-t)}
.spacer{flex:1}
.menu-btn{display:none}

/* layout */
.wrap{display:flex}
aside{width:var(--side);flex:none;position:sticky;top:61px;height:calc(100vh - 61px);overflow-y:auto;padding:16px 10px 40px;border-right:1px solid var(--line)}
aside h4{margin:4px 12px 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
.cat{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;text-align:left;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.cat:hover{background:var(--bg2);color:var(--text)}
.cat.on{background:var(--bg3);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.cat span{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
main{flex:1;min-width:0;padding:22px 26px 60px}
.bar{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.bar h1{margin:0;font-size:46px;line-height:.9}
.bar .count{color:var(--muted);font-size:13px;padding-bottom:4px}
.bar select{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.banner{background:linear-gradient(90deg,rgba(var(--acc-rgb),.14),rgba(var(--acc-rgb),.03));border:1px solid rgba(var(--acc-rgb),.35);border-radius:var(--radius);padding:12px 16px;margin-bottom:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner b{color:var(--accent-t)}
.banner button{margin-left:auto}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(calc(150px * var(--ps)),100%),calc(150px * var(--ps))));justify-content:start;gap:calc(22px * (var(--ps) + 1) / 2) calc(16px * (var(--ps) + 1) / 2)}
.card{cursor:pointer;border:0;background:none;padding:0;text-align:left;outline:none;display:flex;flex-direction:column;justify-content:flex-start;align-self:start;color:inherit}
.poster{position:relative;aspect-ratio:2/3;border-radius:var(--pr);overflow:hidden;background:var(--bg3);box-shadow:0 6px 18px var(--shadow);transition:transform .18s ease,box-shadow .18s ease}
.card:hover .poster,.card:focus-visible .poster{transform:translateY(-4px) scale(1.02);box-shadow:0 14px 30px rgba(0,0,0,.6),0 0 0 2px var(--accent)}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font-family:"Bebas Neue",Impact,sans-serif;font-size:22px;line-height:1;letter-spacing:.03em;color:rgba(255,255,255,.88)}
.ph::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 2px,transparent 2px 10px)}
.ph em{font-style:normal;font-family:Inter;font-size:11px;letter-spacing:0;opacity:.7;margin-top:6px}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.poster img.ld{opacity:1}
.badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.72);color:var(--accent-t);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct{margin-top:8px;font-weight:600;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cy{font-size:12px;color:var(--dim)}
.cy i{font-style:normal;color:var(--muted)}
.empty{color:var(--muted);padding:60px 0;text-align:center}

/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,6,8,.78);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px}
.ov.open{display:flex}
.modal{position:relative;width:100%;max-width:980px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.7);animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.x{position:absolute;top:12px;right:12px;z-index:3;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:22px;cursor:pointer;line-height:1}
.x:hover{background:var(--accent2)}
.hero{position:relative;height:340px;background:var(--bg3) center/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--bg2) 10%,transparent) 0%,color-mix(in srgb,var(--bg2) 55%,transparent) 55%,var(--bg2) 100%)}
.mhead{position:relative;z-index:2;display:flex;gap:24px;padding:0 28px;margin-top:-170px}
.mposter{width:190px;flex:none;aspect-ratio:2/3;border-radius:calc(var(--pr) * 1.2);overflow:hidden;background:var(--bg3);box-shadow:0 12px 30px rgba(0,0,0,.6)}
.mposter img{width:100%;height:100%;object-fit:cover;display:block}
.minfo{align-self:flex-end;padding-bottom:6px;min-width:0}
.minfo h2{margin:0;font-size:52px;line-height:.92}
.tagline{color:var(--accent-t);font-style:italic;margin:6px 0 0}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:var(--bg3);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--muted)}
.chip.star{color:var(--accent-t);border-color:rgba(var(--acc-rgb),.4)}
.mbody{padding:22px 28px 30px}
.mbody p.ovw{font-size:15.5px;line-height:1.65;color:var(--text2);max-width:72ch;margin:0}
.actions{display:flex;gap:10px;margin:18px 0 6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13.5px;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:var(--bg3);color:var(--text)}
.btn.pri{background:var(--accent);border-color:var(--accent-t);color:var(--on-accent)}
.btn:hover{filter:brightness(1.1)}
.sec{margin-top:26px}
.sec h3{font-size:24px;margin:0 0 12px;color:var(--text)}
.cast{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
.person{width:104px;flex:none;text-align:center}
.person .face{width:104px;height:130px;border-radius:10px;background:var(--bg3) center/cover;margin-bottom:6px;display:flex;align-items:center;justify-content:center;font-family:"Bebas Neue",Impact,sans-serif;font-size:30px;color:var(--dim)}
.person b{display:block;font-size:12.5px;line-height:1.25}
.person small{display:block;color:var(--dim);font-size:11.5px;line-height:1.25;margin-top:2px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.gallery img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;cursor:zoom-in;background:var(--bg3);transition:transform .15s}
.gallery img:hover{transform:scale(1.02)}
.note{background:var(--bg3);border-left:3px solid var(--accent);padding:10px 14px;border-radius:6px;color:var(--muted);font-size:13px;margin-top:16px}
.loading{padding:80px 0;text-align:center;color:var(--muted)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent-t);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;cursor:zoom-out;padding:20px}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}

/* settings */
.smodal{max-width:520px;padding:26px 28px}
.smodal h2{margin:0 0 4px;font-size:34px}
.smodal p{color:var(--muted);font-size:13.5px}
.field{margin:14px 0}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
.field input[type=text],.field input[type=password]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;outline:none}
.field input:focus{border-color:var(--accent-t)}
.prov{display:flex;gap:10px}
.prov label{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;text-transform:none;letter-spacing:0;color:var(--text);font-size:14px}
.prov label small{display:block;color:var(--dim);font-weight:400;font-size:12px;margin-top:2px}
.prov input{display:none}
.prov label:has(input:checked){border-color:var(--accent-t);background:rgba(var(--acc-rgb),.08)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--bg3);border:1px solid var(--line);padding:11px 18px;border-radius:10px;z-index:90;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.progress{font-size:12px;color:var(--dim);padding-bottom:6px;margin-left:auto}

/* ratings */
.ratings{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.rt{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:104px}
.rt b{display:block;font-size:21px;line-height:1.2;font-variant-numeric:tabular-nums}
.rt small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600;display:flex;align-items:center;gap:6px}
.rt small i{width:8px;height:8px;border-radius:50%;display:inline-block}
.rt.avg{border-color:rgba(var(--acc-rgb),.6);background:rgba(var(--acc-rgb),.09)}
.rt.avg b{color:var(--accent-t)}
.hint{font-size:12px;color:var(--dim);margin:-8px 0 16px}
/* missing page */
.mview{display:block}
.mpanel{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:28px 30px;max-width:780px}
.mpanel h2{margin:0 0 6px;font-size:40px}

/* ---------- Liquid glass theme ---------- */
@property --a1{syntax:'<color>';inherits:false;initial-value:#1a1030}
@property --a2{syntax:'<color>';inherits:false;initial-value:#102030}
@property --a3{syntax:'<color>';inherits:false;initial-value:#201810}
#amb{display:none}
:root[data-theme="glass"]{
  --bg:#07080b; --bg2:rgba(255,255,255,.06); --bg3:rgba(255,255,255,.1); --line:rgba(255,255,255,.13);
  --text2:#dfe2e8; --muted:#aeb4bf; --dim:#8e95a1;
  --hdr:transparent; --shadow:rgba(0,0,0,.5);
  --gt:.40; --gbl:24px;
  --glass:rgba(18,20,30,var(--gt));
  --glass2:rgba(16,18,27,calc(var(--gt) + .24));
  --gfx:blur(var(--gbl)) saturate(170%);
  --ghi:inset 0 1px 0 rgba(255,255,255,.16), inset 0 -1px 0 rgba(255,255,255,.03);
}
:root[data-theme="glass"][data-frost="1"]{--gt:.28; --gbl:14px}
:root[data-theme="glass"][data-frost="3"]{--gt:.58; --gbl:40px}
:root[data-theme="glass"] body{background:transparent}
:root[data-theme="glass"] #amb{display:block;position:fixed;inset:-8%;z-index:-1;pointer-events:none;opacity:.85;
  background:radial-gradient(55% 50% at 12% 8%,var(--a1),transparent 72%),radial-gradient(50% 60% at 92% 28%,var(--a2),transparent 72%),radial-gradient(70% 50% at 45% 104%,var(--a3),transparent 72%);
  transition:--a1 1.4s ease,--a2 1.4s ease,--a3 1.4s ease}
:root[data-theme="glass"][data-amb="off"] #amb{opacity:.4}
/* header: a floating frosted bar */
:root[data-theme="glass"] header{top:12px;margin:12px 12px 0;border:1px solid var(--line);border-radius:24px;background:var(--glass);-webkit-backdrop-filter:var(--gfx);backdrop-filter:var(--gfx);box-shadow:var(--ghi),0 12px 40px rgba(0,0,0,.35)}
:root[data-theme="glass"] .tabs{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.09)}
:root[data-theme="glass"] .tabs button{transition:background .2s,color .2s}
:root[data-theme="glass"] .tabs button:hover{color:var(--text)}
:root[data-theme="glass"] .tabs button.on{background:rgba(255,255,255,.18);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 10px rgba(0,0,0,.25)}
:root[data-theme="glass"] .search input,:root[data-theme="glass"] .hbtn{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12)}
:root[data-theme="glass"] .hbtn:hover{background:rgba(255,255,255,.14);color:var(--text);border-color:rgba(255,255,255,.22)}
:root[data-theme="glass"] .hbtn.attn.on{background:var(--accent);color:var(--on-accent)}
/* side menu: a glass panel */

<script>
let DATA = [];
const IMG = 'https://image.tmdb.org/t/p/';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- storage (safe) ---------- */
/* Running inside the YAMZ server (Docker)? The server injects window.__YAMZ_SERVER__ and the saved state. */
const YSRV = window.__YAMZ_SERVER__ || null;
const LOCALSTORE = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} },
  keys(){ try{ return Object.keys(localStorage); }catch{ return []; } }
};
const store = !YSRV ? LOCALSTORE : (() => {
  // Everything is kept on the server so every device sees the same library, lists and connections.
  // Appearance stays per-device (a phone and a TV can look different).
  const local = k => k === 'zn:look';
  const M = new Map(Object.entries(window.__YAMZ_STATE__ || {}).map(([k, v]) => [k, JSON.stringify(v)]));
  let pend = {}, gone = new Set(), timer = null, failing = false;
  const flush = beacon => {
    clearTimeout(timer); timer = null;
    if(!Object.keys(pend).length && !gone.size) return;
    const body = JSON.stringify({set:pend, del:[...gone]}); pend = {}; gone = new Set();
    if(beacon === true && navigator.sendBeacon && body.length < 60000){ navigator.sendBeacon('api/state', new Blob([body], {type:'application/json'})); return; }
    fetch('api/state', {method:'PATCH', credentials:'same-origin', headers:{'Content-Type':'application/json', 'X-YAMZ':'1'}, body, keepalive:body.length < 60000})
      .then(r => { if(r.status === 401) return location.reload(); if(!r.ok) throw new Error('HTTP ' + r.status); if(failing){ failing = false; window.toast?.('✓ Saved to your YAMZ server again.'); } })
      .catch(() => { const d = JSON.parse(body); Object.assign(pend, d.set); d.del.forEach(k => gone.add(k)); if(!failing){ failing = true; window.toast?.("Couldn't save to the YAMZ server — will keep trying."); } timer = setTimeout(flush, 5000); });
  };
  addEventListener('pagehide', () => flush(true));
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') flush(); });
  return {
    get(k){ if(local(k)) return LOCALSTORE.get(k); const v = M.get(k); return v ? JSON.parse(v) : null; },
    set(k, v){ if(local(k)) return LOCALSTORE.set(k, v); const s = JSON.stringify(v); if(s === undefined) return this.del(k); if(M.get(k) === s) return; M.set(k, s); pend[k] = v; gone.delete(k); if(!timer) timer = setTimeout(flush, 600); },
    del(k){ if(local(k)) return LOCALSTORE.del(k); if(!M.has(k)) return; M.delete(k); delete pend[k]; gone.add(k); if(!timer) timer = setTimeout(flush, 600); },
    keys(){ return [...M.keys()]; },
    flush
  };
})();
/* In server mode, requests to servers on your network (Plex, Jellyfin, Radarr, Sonarr…) go through YAMZ,
   which avoids browser CORS / mixed-content blocks — including behind an https reverse proxy. */
const PUBLIC_HOSTS = /(^|\.)(plex\.tv|wikipedia\.org|wikidata\.org|wikimedia\.org|tvmaze\.com|themoviedb\.org|tmdb\.org|omdbapi\.com|googleapis\.com|gstatic\.com|youtube\.com|imdb\.com)$/i;
const viaProxy = u => { if(!YSRV) return false; try{ const x = new URL(u, location.href); return /^https?:$/.test(x.protocol) && x.origin !== location.origin && !PUBLIC_HOSTS.test(x.hostname); }catch{ return false; } };
const px = u => u && viaProxy(u) ? 'api/proxy?u=' + encodeURIComponent(u) : u;
if(YSRV){
  const nativeFetch = window.fetch.bind(window);
  window.fetch = (input, init = {}) => {
    const u = typeof input === 'string' ? input : input instanceof URL ? input.href : input?.url;
    if(u && viaProxy(u)){
      const h = new Headers(init.headers || (input instanceof Request ? input.headers : undefined)); h.set('X-YAMZ', '1');
      return nativeFetch(px(u), {...init, headers:h, credentials:'same-origin'}).then(r => { if(r.status === 401 && r.headers.get('X-YAMZ-Auth')) location.reload(); return r; });
    }
    return nativeFetch(input, init);
  };
}
let cfg = store.get('vault:cfg') || {prov:'free', key:'', pin:''};

/* ---------- state ---------- */
let state = { s:'movie', c:'All', q:'', sort:'az', attn:false };
let cats = {movie:[], tv:[]};

/* ---------- providers ---------- */

try{ if(window.self !== window.top) inPreview = true; }catch{ inPreview = true; }
async function netFetch(url, opts={}){
  for(let n = 0; ; n++){
    try{ return await fetch(url, opts); }
    catch(err){
      if(n < 1){ await new Promise(r => setTimeout(r, 900)); continue; }
      const e = new TypeError('Failed to fetch'); e.net = true; e.host = new URL(url).hostname; throw e;
    }
  }

  if(!r.ok){ const e = new Error('HTTP '+r.status); e.status = r.status; throw e; }
  return r.json();

const TMDB = {
  id:'tmdb', name:'TMDB',
  url(path, params={}){
    const u = new URL('https://api.themoviedb.org/3'+path);
    Object.entries(params).forEach(([k,v]) => v!=null && v!=='' && u.searchParams.set(k,v));

  async search(d){
    const type = d.s==='tv' ? 'tv' : 'movie';

    const r = j.results?.[0]; if(!r) return {none:true};
    return {id:r.id, type, poster: r.poster_path ? IMG+'w342'+r.poster_path : null, g: canon((r.genre_ids||[]).map(x => TMDB_G[x]).filter(Boolean))};
  },

    return (j.results||[]).slice(0,8).map(r => ({m:{id:r.id, type, poster:r.poster_path ? IMG+'w342'+r.poster_path : null, g:canon((r.genre_ids||[]).map(x => TMDB_G[x]).filter(Boolean))},
      title:r.title || r.name, year:(r.release_date || r.first_air_date || '').slice(0,4), desc:(r.overview||'').slice(0,160)}));
  },
  async details(m){

let pausedUntil = 0, backoff = 0, pumpT = null, indexMsg = '';

function pump(){

  while(active < max && queue.length){
    const d = queue.shift();
    if(!needsSearch(d)){ d._q = false; paint(d); continue; }
    active++;
    P().search(d).then(m => { store.set(ck(d), m); mem.set(d.i, m); paint(d); backoff = 0; netErrs = 0; d._q = false; catsChanged(); })
      .catch(e => {

          return;

const RCOL = {'IMDb':'#f5c518', 'Rotten Tomatoes':'#fa320a', 'Metacritic':'#66cc33', 'TVmaze':'#3c948b', 'TMDB':'#01b4e4'};
function pct(v){
  v = String(v||''); let m;
  if(m = v.match(/([\d.]+)\s*%/)) return +m[1];
  if(m = v.match(/([\d.]+)\s*\/\s*100\b/)) return +m[1];
  if(m = v.match(/([\d.]+)\s*\/\s*10\b/)) return +m[1]*10;
  if(m = v.match(/([\d.]+)\s*\/\s*5\b/)) return +m[1]*20;
  return null;
}
function setRating(x, src, val){ x.ratings = (x.ratings||[]).filter(r => r.src !== src); if(val && !/N\/A/.test(val)) x.ratings.push({src, val}); }
async function addOMDb(x){
  if(!cfg.omdb || !x.imdb || x._omdb) return; x._omdb = true;
  try{
    const o = await getJSON(`https://www.omdbapi.com/?i=${encodeURIComponent(x.imdb)}&apikey=${encodeURIComponent(cfg.omdb)}`);
    if(o.Response !== 'True') return;
    (o.Ratings||[]).forEach(r => setRating(x, r.Source==='Internet Movie Database' ? 'IMDb' : r.Source, r.Value));
    if(o.imdbRating && o.imdbRating !== 'N/A') setRating(x, 'IMDb', o.imdbRating+'/10');
  }catch{}
}
function ratingsHTML(x){
  const order = ['IMDb','Rotten Tomatoes','Metacritic','TMDB','TVmaze'];

    ${rs.map(r => `<div class="rt"><small><i style="background:${RCOL[r.src]||'#888'}"></i>${esc(r.src)}</small><b>${esc(r.val.replace(/\s/g,''))}</b></div>`).join('')}
    ${rs.length > 1 ? `<div class="rt avg"><small><i style="background:var(--accent)"></i>Average</small><b>${avg}<span style="font-size:13px;color:var(--muted)">/100</span></b></div>` : ''}

const SER = new Map();
async function serLoad(qid){

  OPTIONAL { ?st pq:P1545 ?ord }

    const sid = qidOf(r.s.value), mq = qidOf(r.m.value);

    const M = S.m[mq] ||= {q:mq, t:r.mLabel?.value || mq, d:'', ord:null, art:null};

    .sort((a, b) => a.items.length - b.items.length).slice(0, 2);
}

/* ================= MISSING: collections & actors via Wikidata ================= */
const MISS_TITLE = 'Gaps';
const MISS = { kind: store.get('zn:misskind') || 'movie', filter:'', data: store.get('zn:miss'), qmap: store.get('zn:qid') || {}, running:false, prog:null, err:null,
  kids: store.get('zn:kids') ?? false, showOwn: store.get('zn:own') ?? true };
const PP = store.get('zn:pp') || {};
const MINI = new Map();
const isKid = c => /family|kid|child|christmas|xmas|animat|cartoon|disney|pixar/i.test(c||'');
const FTYPES = 'VALUES ?ft { wd:Q11424 wd:Q24869 wd:Q29168811 wd:Q202866 wd:Q93204 }';
const norm = s => (s||'').toLowerCase().replace(/&/g,'and').replace(/^(the|a|an) /,'').replace(/[^a-z0-9]/g,'');
const isPack = d => /collection|trilogy|\bpack\b|box ?set|\bfilms\b|\bsaga\b|specials|\d\s*[–-]\s*\d|\b[IVX]+[–-][IVX]+\b|Episodes/i.test(d.t);
const packRange = d => { const m = (d.n+' '+d.t).match(/(\d{4})\s*[–-]\s*(\d{4})/); return m ? [+m[1], +m[2]] : null; };
const artTitle = iri => iri ? decodeURIComponent((iri.split('/wiki/')[1]||'')).replace(/_/g,' ') : null;
const qidOf = iri => (iri||'').split('/').pop();
const chunk = (a,n) => Array.from({length:Math.ceil(a.length/n)}, (_,i) => a.slice(i*n, i*n+n));
const uniq = a => [...new Set(a)];
const keyOf = d => d.t+'|'+(d.y||'');
const today = new Date().toISOString().slice(0,10);
async function pool(items, n, fn){ let i = 0; await Promise.all(Array.from({length:Math.min(n, items.length)}, async () => { while(i < items.length){ const k = i++; await fn(items[k], k); } })); }
async function sparql(q){
  for(let n = 0; n < 4; n++){
    let r;
    try{ r = await netFetch('https://query.wikidata.org/sparql', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded', Accept:'application/sparql-results+json'}, body:'query='+encodeURIComponent(q)}); }
    catch(e){ if(n < 3){ await sleep(15000 * (n+1)); continue; } throw e; }
    if(r.status===429 || r.status>=500){ const ra = +r.headers.get('Retry-After') || 0; await sleep(Math.max(ra*1000, 5000*(n+1))); continue; }
    if(!r.ok){ const e = new Error('Wikidata HTTP '+r.status); e.status = r.status; throw e; }
    return (await r.json()).results.bindings;
  }
  throw new Error('Wikidata is busy — try again in a few minutes');
}
const ownedMovies = () => { const s = new Set(); return DATA.filter(d => d.s==='movie' && !s.has(keyOf(d)) && s.add(keyOf(d))); };

function setProg(stage, label, done, total){ MISS.prog = {stage, label, done, total}; if(state.s==='missing' && !state.q) renderMissing(); }

async function verifyFilms(qids){
  const ok = new Set();
  for(const c of chunk(uniq(qids), 150)){
    const rows = await sparql(`SELECT DISTINCT ?f WHERE { VALUES ?f { ${c.map(q => 'wd:'+q).join(' ')} } ?f wdt:P31/wdt:P279* wd:Q11424 }`);
    rows.forEach(r => ok.add(qidOf(r.f.value)));
  }
  return ok;
}

async function runScan(){
  if(MISS.running) return;
  if(inPreview){ toast('Open the file in your web browser first — previews block internet access.'); return; }
  MISS.running = true; MISS.err = null; if(state.s==='missing') renderSide();
  try{
    const items = ownedMovies();
    /* 1. match titles to Wikipedia/Wikidata */
    const withI = items.filter(d => d.ids?.imdb && !(keyOf(d) in MISS.qmap));
    if(withI.length){
      setProg(1, 'Matching your movies by IMDb ID', 0, 1);
      const hits = await imdbToQ(withI.map(d => d.ids.imdb));
      withI.forEach(d => { const h = hits[d.ids.imdb]; if(h) MISS.qmap[keyOf(d)] = h.q; });
    }
    const todo = items.filter(d => !(keyOf(d) in MISS.qmap));
    const cands = new Map();
    todo.forEach(d => { const q = d.q; cands.set(d, uniq([d.y ? `${q} (${d.y} film)` : null, `${q} (film)`, q].filter(Boolean))); });
    const titles = uniq([...cands.values()].flat()), found = {};
    let n = 0;
    setProg(1, 'Matching your movies to Wikipedia', 0, titles.length);
    await pool(chunk(titles, 50), 2, async c => {
      const j = await wqr({action:'query', titles:c.join('|'), redirects:'1', prop:'pageprops', ppprop:'wikibase_item|disambiguation'});
      const nm = {}, rd = {}, pg = {};
      (j.query?.normalized||[]).forEach(x => nm[x.from] = x.to);
      (j.query?.redirects||[]).forEach(x => rd[x.from] = x.to);
      (j.query?.pages||[]).forEach(p => pg[p.title] = p);
      c.forEach(t => { let x = nm[t] || t; x = rd[x] || x; const p = pg[x];
        if(p && !p.missing && p.pageprops?.wikibase_item && !('disambiguation' in p.pageprops)) found[t] = p.pageprops.wikibase_item; });
      n += c.length; setProg(1, 'Matching your movies to Wikipedia', n, titles.length);
    });
    setProg(2, 'Checking matches are films', 0, 1);
    const films = await verifyFilms(Object.values(found));
    const unresolved = [];
    todo.forEach(d => { const q = cands.get(d).map(t => found[t]).find(q => q && films.has(q)); if(q) MISS.qmap[keyOf(d)] = q; else unresolved.push(d); });
    /* 1b. search for the rest */
    const guesses = new Map(); n = 0;
    setProg(2, 'Searching for harder-to-find titles', 0, unresolved.length);
    await pool(unresolved, 2, async d => {
      try{
        const j = await wqr({action:'query', generator:'search', gsrsearch:`${d.q} ${d.y||''} film`, gsrlimit:'3', prop:'pageprops', ppprop:'wikibase_item'});
        guesses.set(d, (j.query?.pages||[]).sort((a,b) => a.index-b.index).map(p => p.pageprops?.wikibase_item).filter(Boolean));
      }catch{}
      setProg(2, 'Searching for harder-to-find titles', ++n, unresolved.length);
    });
    const films2 = await verifyFilms([...guesses.values()].flat());
    unresolved.forEach(d => { MISS.qmap[keyOf(d)] = (guesses.get(d)||[]).find(q => films2.has(q)) || null; });
    store.set('zn:qid', MISS.qmap);

    const owned = items.map(d => ({d, q:MISS.qmap[keyOf(d)]})).filter(o => o.q);
    const ownedQ = new Set(owned.map(o => o.q));
    const catOf = {}; owned.forEach(o => { const gs = (genresOf(o.d)||[]).join(' '); if(!catOf[o.q] || isKid(catOf[o.q])) catOf[o.q] = gs; });
    const byNorm = new Map(); items.forEach(d => [d.t, d.q].forEach(t => { const k = norm(t); if(!byNorm.has(k)) byNorm.set(k, []); byNorm.get(k).push(d.y); }));
    const ownT = (t, y) => { const ys = byNorm.get(norm(t)); return !!ys && (!y || ys.some(oy => !oy || Math.abs(oy - y) <= 1)); };
    const packs = new Map(owned.filter(o => isPack(o.d)).map(o => [o.q, packRange(o.d)]));
    const qlist = [...ownedQ];

    /* 2. collections */
    const series = {}; n = 0;
    const qc = chunk(qlist, 120);
    setProg(3, 'Finding franchises and collections', 0, qc.length);
    for(const c of qc){
      const rows = await sparql(`SELECT ?f ?s ?sLabel ?m ?mLabel ?date ?art WHERE {
        VALUES ?f { ${c.map(q => 'wd:'+q).join(' ')} }
        ?f wdt:P179 ?s . ?m wdt:P179 ?s ; wdt:P31 ?ft . ${FTYPES}
        OPTIONAL { ?m wdt:P577 ?date }
        OPTIONAL { ?art schema:about ?m ; schema:isPartOf <https://en.wikipedia.org/> }
        SERVICE wikibase:label { bd:serviceParam wikibase:language "en". } }`);
      rows.forEach(r => {
        const s = qidOf(r.s.value), m = qidOf(r.m.value), f = qidOf(r.f.value);
        const S = series[s] ||= {id:s, name:r.sLabel?.value || s, m:{}, packOwn:new Set(), via:new Set()};
        S.via.add(f);
        const M = S.m[m] ||= {q:m, t:r.mLabel?.value || m, d:'', art:artTitle(r.art?.value)};
        const dt = (r.date?.value||'').slice(0,10); if(dt && (!M.d || dt < M.d)) M.d = dt;
        if(!M.art && r.art) M.art = artTitle(r.art.value);
      });
      setProg(3, 'Finding franchises and collections', ++n, qc.length);
    }
    const status = (M, S) => {
      const y = +M.d.slice(0,4) || null;
      if(ownedQ.has(M.q) || ownT(M.t, y)) return 'own';
      for(const f of S.via){ if(packs.has(f)){ const r = packs.get(f); if(!r || (y && y >= r[0]-1 && y <= r[1]+1)) return 'own'; } }
      if(!M.d || M.d > today) return 'up';
      return 'miss';
    };
    const coll = Object.values(series).map(S => {
      const mem = Object.values(S.m).filter(M => !/^Q\d+$/.test(M.t)).map(M => ({q:M.q, t:M.t, y:+M.d.slice(0,4) || null, art:M.art, st:status(M, S)}))
        .sort((a,b) => (a.y||9999) - (b.y||9999));
      return {id:S.id, name:S.name, items:mem, own:mem.filter(x => x.st==='own').length, miss:mem.filter(x => x.st==='miss').length};
    }).filter(c => c.items.length >= 2 && c.miss > 0 && c.own > 0)
      .sort((a,b) => (b.own/b.items.length) - (a.own/a.items.length) || b.own - a.own);

    /* 3. actors */
    const count = {}; n = 0;
    setProg(4, 'Counting actors across your movies', 0, qc.length);
    for(const c of qc){
      const rows = await sparql(`SELECT DISTINCT ?f ?a WHERE { VALUES ?f { ${c.map(q => 'wd:'+q).join(' ')} } ?f wdt:P161 ?a }`);
      rows.forEach(r => { const a = qidOf(r.a.value), f = qidOf(r.f.value); const C = count[a] ||= {all:0, adult:0}; C.all++; if(!isKid(catOf[f])) C.adult++; });
      setProg(4, 'Counting actors across your movies', ++n, qc.length);
    }
    const top = k => Object.entries(count).filter(([,c]) => c[k] >= 4).sort((a,b) => b[1][k] - a[1][k]).slice(0, 30).map(([a]) => a);
    const actorIds = uniq([...top('adult'), ...top('all')]);
    const actors = []; n = 0;
    const ac = chunk(actorIds, 8);
    setProg(5, 'Looking up their filmographies', 0, ac.length);
    for(const c of ac){
      const rows = await sparql(`SELECT ?a ?aLabel ?img ?m ?mLabel ?date ?art WHERE {
        VALUES ?a { ${c.map(q => 'wd:'+q).join(' ')} }
        ?m wdt:P161 ?a ; wdt:P31 ?ft . ${FTYPES}
        OPTIONAL { ?a wdt:P18 ?img }
        OPTIONAL { ?m wdt:P577 ?date }
        OPTIONAL { ?art schema:about ?m ; schema:isPartOf <https://en.wikipedia.org/> }
        SERVICE wikibase:label { bd:serviceParam wikibase:language "en". } }`);
      const by = {};
      rows.forEach(r => {
        const a = qidOf(r.a.value), m = qidOf(r.m.value);
        const A = by[a] ||= {id:a, name:r.aLabel?.value || a, img:r.img ? r.img.value.replace(/^http:/,'https:')+'?width=180' : null, m:{}};
        const M = A.m[m] ||= {q:m, t:r.mLabel?.value || m, d:'', art:artTitle(r.art?.value)};
        const dt = (r.date?.value||'').slice(0,10); if(dt && (!M.d || dt < M.d)) M.d = dt;
      });
      Object.values(by).forEach(A => {
        const films = Object.values(A.m).filter(M => !/^Q\d+$/.test(M.t)).map(M => {
          const y = +M.d.slice(0,4) || null;
          const st = (ownedQ.has(M.q) || ownT(M.t, y)) ? 'own' : (!M.d || M.d > today) ? 'up' : 'miss';
          return {q:M.q, t:M.t, y, art:M.art, st};
        }).sort((a,b) => (b.y||0) - (a.y||0));
        const miss = films.filter(f => f.st==='miss');
        actors.push({id:A.id, name:A.name, img:A.img, all:count[A.id].all, adult:count[A.id].adult,
          items:[...films.filter(f => f.st==='up').slice(0,6), ...miss.slice(0,60), ...films.filter(f => f.st==='own')], miss:miss.length});
      });
      setProg(5, 'Looking up their filmographies', ++n, ac.length);
    }
    MISS.data = {at:Date.now(), total:items.length, matched:owned.length, coll, actors};
    store.set('zn:miss', MISS.data);
    toast(`Done — ${coll.length} incomplete collections and ${actors.length} actors found.`);
  }catch(e){
    MISS.err = e.net ? `Couldn't reach ${e.host}. Check your connection or ad blocker, then try again.` : (e.message || 'Something went wrong.');
  }finally{
    MISS.running = false; MISS.prog = null;
    if(state.s==='missing'){ renderSide(); render(); }
  }
}

const WAIT = {radarr:null, sonarr:null};
async function waitLoad(svc, force){
  if(!arrOn(svc)) return;
  const W = WAIT[svc] ||= {items:null, at:0, busy:false, err:null};
  if(W.busy || (!force && W.items && Date.now() - W.at < 5*60e3)) return;
  W.busy = true; W.err = null; if(state.s === 'missing'){ renderSide(); if(state.c === WAIT_C[ARR_DEF[svc].kind]) render(); }
  try{
    const all = await arrReq(svc, ARR_DEF[svc].lib) || [];
    const today = isoDay(new Date()), poster = m => (m.images || []).find(i => i.coverType === 'poster');
    W.items = svc === 'radarr'
      ? all.filter(m => m.monitored && !m.hasFile).map(m => {
          const dates = [m.digitalRelease, m.physicalRelease, m.inCinemas].filter(Boolean).map(d => d.slice(0, 10)).sort();
          const next = dates.find(d => d > today) || null;
          return {id:m.id, t:m.title, y:m.year || null, slug:m.titleSlug, img:poster(m)?.remoteUrl || null, s:'movie',
            ready:m.isAvailable !== false && !(m.status === 'announced'), next, cinema:(m.inCinemas || '').slice(0, 10), added:m.added || ''};
        })
      : all.filter(m => m.monitored && (m.statistics?.episodeCount || 0) > (m.statistics?.episodeFileCount || 0)).map(m => ({
          id:m.id, t:m.title, y:m.year || null, slug:m.titleSlug, img:poster(m)?.remoteUrl || null, s:'tv',
          have:m.statistics.episodeFileCount || 0, of:m.statistics.episodeCount || 0, net:m.network || '', added:m.added || ''}));
    W.at = Date.now();
  }catch(e){ W.err = `Couldn't reach ${ARR_DEF[svc].name}${e.message ? ` (${e.message})` : ''}.`; }
  W.busy = false;
  if(state.s === 'missing'){ renderSide(); if(state.c === WAIT_C[ARR_DEF[svc].kind]) render(); }
}

function ownedTest(kind){
  const own = new Map(); DATA.filter(d => d.s===kind).forEach(d => { const k = fold(d.t); if(!own.has(k)) own.set(k, []); own.get(k).push(d.y); });
  return x => { const ys = own.get(fold(x.t)); return !!ys && (!x.y || ys.some(y => !y || Math.abs(y - x.y) <= 1)); };
}
async function manSearch(q, kind){
  const hint = kind === 'movie' ? 'film' : 'television series';
  const run = async term => (await wq({action:'query', generator:'search', gsrsearch:term, gsrlimit:'20', prop:'pageprops', ppprop:'wikibase_item'})).query?.pages || [];
  let pages = (await run(`${q} ${hint}`)).sort((a, b) => (a.index||0) - (b.index||0));
  const more = (await run(q)).sort((a, b) => (a.index||0) - (b.index||0)).filter(p => !pages.some(x => x.pageid === p.pageid));
  pages = [...pages, ...more].filter(p => p.pageprops?.wikibase_item);
  if(!pages.length) return [];
  const types = kind === 'movie' ? FILM_T : TV_T, dateP = kind === 'movie' ? 'wdt:P577' : 'wdt:P580|wdt:P577';
  const rows = await sparql(`#yamz:search
SELECT ?f (MIN(?d) AS ?date) WHERE { VALUES ?f { ${uniq(pages.map(p => 'wd:' + p.pageprops.wikibase_item)).join(' ')} }
  VALUES ?t { ${types} } ?f wdt:P31 ?t . OPTIONAL { ?f ${dateP} ?d } } GROUP BY ?f`);
  const dates = new Map(rows.map(r => [qidOf(r.f.value), (r.date?.value || '').slice(0, 10)]));
  const seen = new Set();
  return pages.filter(p => { const k = p.pageprops.wikibase_item; if(!dates.has(k) || seen.has(k)) return false; seen.add(k); return true; }).slice(0, 30)
    .map(p => { const date = dates.get(p.pageprops.wikibase_item); return {q:p.pageprops.wikibase_item, t:cleanArt(p.title), y:+date.slice(0, 4) || null, date, art:p.title, s:kind}; });
}
async function manGo(){
  const q = MAN.q.trim(), my = ++MAN.seq;
  if(!q){ MAN.items = null; MAN.err = null; return renderManRes(); }
  MAN.busy = true; MAN.err = null; renderManRes();
  try{ const items = await manSearch(q, MAN.kind); if(my !== MAN.seq) return; MAN.items = items; }
  catch(e){ if(my !== MAN.seq) return; MAN.items = null; MAN.err = `Search failed${e.net ? ` — couldn't reach ${e.host}` : ''}. Try again in a moment.`; }
  MAN.busy = false; renderManRes();
}

/* ================= TV: scan folder for episodes, compare with TVmaze ================= */
const TV = { eps: {}, res: store.get('zn:tvr'), at: null,
  ids: store.get('zn:tvid') || {}, real: store.get('zn:real') ?? false, running:false, prog:null, err:null };
const fold = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/&/g,'and').replace(/\bbbq\b/g,'barbecue').replace(/^(the|a|an) /,'').replace(/[^a-z0-9]/g,'');
const VID = /\.(mkv|mp4|avi|m4v|ts|wmv|mov|mpe?g|webm)$/i;
function cleanFolder(name){
  let s = name.replace(/\[[^\]]*\]/g,' ').replace(/[._]+/g,' ');
  const i = s.search(/\b(S\d{1,2}(E\d+)?|S\d{1,2}\s*-\s*S?\d{1,2}|Season\s*\d+|Seasons|Series\s*\d|Complete|\d{3,4}[pi]|(19|20)\d\d|Blu-?Ray|BRRip|BDRip|WEB(-?DL|Rip)?|DVD(Rip)?|HDTV|x26[45]|hevc|10bit|AMZN|NF|ATVP|HMAX|DSNP)\b/i);
  if(i > 0) s = s.slice(0, i);
  return s.replace(/[\s(\-–]+$/,'').trim();
}
function parseEp(name){
  let m = name.match(/S(\d{1,2})\s*[ ._-]?\s*E(\d{1,3})((?:\s*-?\s*E\d{1,3}|-\d{2}(?!\d))*)/i);
  if(m){
    const s = +m[1], a = +m[2], tail = [...(m[3]||'').matchAll(/\d{1,3}/g)].map(x => +x[0]);
    const b = tail.length ? Math.max(a, tail[tail.length-1]) : a;
    return {s, eps: Array.from({length: Math.min(b-a, 20)+1}, (_,k) => a+k)};
  }
  m = name.match(/(?:^|[ ._-])(\d{1,2})x(\d{2,3})(?:[ ._-]|$)/i);
  return m ? {s:+m[1], eps:[+m[2]]} : null;
}
async function tvGet(url){
  for(let n = 0; ; n++){
    try{ return await getJSON(url); }
    catch(e){ if(e.status===429 && n < 5){ await new Promise(r => setTimeout(r, 2500*(n+1))); continue; } throw e; }
  }
}
async function tvmazeId(d){
  if(d.t in TV.ids) return TV.ids[d.t];
  let s = null;
  for(const [k, v] of [['thetvdb', d.ids?.tvdb], ['imdb', d.ids?.imdb]]){
    if(s || !v) continue;
    try{ s = await tvGet(`https://api.tvmaze.com/lookup/shows?${k}=${encodeURIComponent(v)}`); }catch(e){ if(e.status!==404) throw e; }
  }
  if(!s) try{ s = await tvGet('https://api.tvmaze.com/singlesearch/shows?q='+encodeURIComponent(d.q)); }catch(e){ if(e.status!==404) throw e; }
  TV.ids[d.t] = s ? {id:s.id, name:s.name, img:s.image?.medium || null, type:s.type || ''} : null;
  store.set('zn:tvid', TV.ids);
  return TV.ids[d.t];
}
function seasonSummary(episodes, owned){
  const by = {};
  episodes.filter(e => e.number != null && e.season > 0).forEach(e => {
    const S = by[e.season] ||= {n:e.season, total:0, aired:[], up:0};
    S.total++; if(e.airdate && e.airdate <= today) S.aired.push(e.number); else S.up++;
  });
  return Object.values(by).sort((a,b) => a.n - b.n).map(S => {
    const have = new Set((owned?.[S.n]) || []);
    const miss = S.aired.filter(x => !have.has(x)).sort((a,b) => a-b);
    return {n:S.n, total:S.total, aired:S.aired.length, up:S.up, have:S.aired.filter(x => have.has(x)).length, miss};
  });
}
const showOf = t => DATA.find(d => d.s==='tv' && d.t===t);
async function tvCheck(){
  if(TV.running) return;
  if(inPreview){ toast('Open the file in your web browser first — previews block internet access.'); return; }
  TV.running = true; TV.err = null;
  const titles = Object.keys(TV.eps), res = {}; let n = 0;
  TV.prog = {done:0, total:titles.length}; render();
  try{
    await pool(titles, 2, async t => {
      const d = showOf(t); if(!d) return;
      try{
        const id = await tvmazeId(d);
        if(id){
          const eps = await tvGet(`https://api.tvmaze.com/shows/${id.id}/episodes`);
          const seasons = seasonSummary(eps, TV.eps[t]);
          const missEp = seasons.reduce((s,x) => s + x.miss.length, 0);
          EPC.set(id.id, eps);
          res[t] = {t, id:id.id, i:d.i, c:d.c, type:id.type || '', name:id.name, img:id.img, seasons, missEp,
            missS: seasons.filter(s => s.aired && !s.have).length, full: seasons.filter(s => s.aired && s.have===s.aired).length,
            aired: seasons.filter(s => s.aired).length};
        }
      }catch(e){ if(e.net) throw e; }
      TV.prog = {done:++n, total:titles.length}; if(state.s==='missing' && TV_CATS.includes(state.c)) renderTvMissing(true);
    });
    TV.res = res; store.set('zn:tvr', res);
    toast(`TV check done — ${Object.values(res).filter(r => r.missEp > 0).length} shows have missing episodes.`);
  }catch(e){ TV.err = e.net ? `Couldn't reach ${e.host}. Check your connection or ad blocker.` : e.message; }
  finally{ TV.running = false; TV.prog = null; if(state.s==='missing'){ renderSide(); render(); } }
}

async function fetchT(url, opts = {}, ms = 10000){
  const c = new AbortController(), tm = setTimeout(() => c.abort(), ms);
  try{ return await fetch(url, {...opts, signal:c.signal}); }
  catch(err){ const e = new TypeError('Failed to fetch'); e.net = true; e.host = new URL(url).host; throw e; }
  finally{ clearTimeout(tm); }
}
async function jget(url, opts, ms){ const r = await fetchT(url, opts, ms); if(!r.ok){ const e = new Error('HTTP '+r.status); e.status = r.status; throw e; } return r.json(); }
const qs = o => new URLSearchParams(Object.entries(o).filter(([,v]) => v != null && v !== '')).toString();
const normUrl = u => { u = (u||'').trim().replace(/\/+$/,''); if(u && !/^https?:\/\//i.test(u)) u = 'http://' + u; return u; };
const ago = ts => { if(!ts) return 'never'; const m = Math.round((Date.now()-ts)/60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m/60)} h ago` : `${Math.round(m/1440)} d ago`; };

/* ---- Plex ---- */
const PLEX_HDR = {Accept:'application/json', 'X-Plex-Client-Identifier':CID, 'X-Plex-Product':'YAMZ', 'X-Plex-Version':'1.0', 'X-Plex-Platform':'Web', 'X-Plex-Device-Name':'YAMZ'};
const PLEX = {
  label:'Plex',
  async get(s, path, params = {}, ms){ return (await jget(`${s.url}${path}?${qs({...params, 'X-Plex-Token':s.token})}`, {headers:{Accept:'application/json'}}, ms)).MediaContainer || {}; },
  img(s, th){ return th ? px(`${s.url}/photo/:/transcode?${qs({width:300, height:450, minSize:1, upscale:1, url:th, 'X-Plex-Token':s.token})}`) : null; },
  play(s, k){ return `https://app.plex.tv/desktop/#!/server/${s.machine}/details?key=${encodeURIComponent('/library/metadata/'+k)}`; },
  async pin(){ return jget('https://plex.tv/api/v2/pins?strong=true', {method:'POST', headers:PLEX_HDR}); },
  async checkPin(id){ return jget(`https://plex.tv/api/v2/pins/${id}`, {headers:PLEX_HDR}); },
  async discover(token){
    const res = await jget('https://plex.tv/api/v2/resources?includeHttps=1&includeRelay=1', {headers:{...PLEX_HDR, 'X-Plex-Token':token}});
    const servers = res.filter(r => String(r.provides||'').includes('server'));
    const out = [];
    for(const r of servers){
      const conns = [...(r.connections||[])].sort((a,b) => (b.local - a.local) || (a.relay - b.relay));
      for(const c of conns){
        try{ await jget(`${c.uri}/identity?X-Plex-Token=${encodeURIComponent(r.accessToken || token)}`, {headers:{Accept:'application/json'}}, 4000); out.push({name:r.name, url:c.uri, token:r.accessToken || token, machine:r.clientIdentifier, owned:!!r.owned}); break; }catch{}
      }
    }
    return {found:servers.length, ok:out};
  },
  async identity(url, token){ const m = (await jget(`${url}/identity?X-Plex-Token=${encodeURIComponent(token)}`, {headers:{Accept:'application/json'}}, 6000)).MediaContainer || {}; return {machine:m.machineIdentifier, name:m.friendlyName}; },
  async libs(s){ return ((await this.get(s, '/library/sections')).Directory || []).filter(x => x.type==='movie' || x.type==='show').map(x => ({key:String(x.key), name:x.title, kind:x.type==='movie' ? 'movie' : 'tv'})); },
  async paged(s, path, params, each, prog){
    let start = 0; const size = 2000;
    for(;;){
      const mc = await this.get(s, path, {...params, 'X-Plex-Container-Start':start, 'X-Plex-Container-Size':size}, 60000);
      const md = mc.Metadata || []; md.forEach(each); start += md.length; prog?.(start, mc.totalSize);
      if(!md.length || md.length < size || (mc.totalSize && start >= mc.totalSize)) break;
    }
  },
  ids(x){ const o = {}; (x.Guid||[]).forEach(g => { const m = String(g.id).match(/^(imdb|tmdb|tvdb):\/\/(.+)$/); if(m) o[m[1]] = m[2]; }); return o; },
  ratings(x){
    const r = [];
    if(x.rating != null && /rottentomatoes/.test(x.ratingImage||'')) r.push({src:'Rotten Tomatoes', val:Math.round(x.rating*10)+'%'});
    if(x.rating != null && /imdb/.test(x.ratingImage||'')) r.push({src:'IMDb', val:(+x.rating).toFixed(1)+'/10'});
    if(x.audienceRating != null && /imdb/.test(x.audienceRatingImage||'')) r.push({src:'IMDb', val:(+x.audienceRating).toFixed(1)+'/10'});
    if(x.audienceRating != null && /themoviedb/.test(x.audienceRatingImage||'')) r.push({src:'TMDB', val:(+x.audienceRating).toFixed(1)+'/10'});
    return r;
  },
  async sync(s, prog){
    const movies = [], shows = {};
    for(const L of s.libs.filter(l => l.on)){
      if(L.kind==='movie'){
        await this.paged(s, `/library/sections/${L.key}/all`, {type:1, includeGuids:1}, x => movies.push({t:x.title, y:x.year || null, n:x.editionTitle || '', ids:this.ids(x), th:x.thumb || null, g:(x.Genre||[]).map(g => g.tag), r:this.ratings(x), k:x.ratingKey}), n => prog?.(`${L.name}: ${n.toLocaleString()} movies`));
      } else {
        await this.paged(s, `/library/sections/${L.key}/all`, {type:2, includeGuids:1}, x => { shows[x.ratingKey] = {t:x.title, y:x.year || null, ids:this.ids(x), th:x.thumb || null, g:(x.Genre||[]).map(g => g.tag), r:this.ratings(x), k:x.ratingKey, eps:{}}; }, n => prog?.(`${L.name}: ${n.toLocaleString()} shows`));
        await this.paged(s, `/library/sections/${L.key}/all`, {type:4}, x => { const S = shows[x.grandparentRatingKey]; if(!S || x.parentIndex == null || x.index == null) return; const a = (S.eps[x.parentIndex] ||= []); if(!a.includes(x.index)) a.push(x.index); }, n => prog?.(`${L.name}: ${n.toLocaleString()} episodes`));
      }
    }
    return {movies, shows:Object.values(shows)};
  }
};

const EXTRA = /(^|[\/ ._-])(sample|trailer|featurettes?|extras?|behind[ ._-]the[ ._-]scenes|deleted[ ._-]scenes?|bonus|interviews?|bloopers?)([\/ ._-]|$)/i;

  let s = isFile ? raw.replace(/\.[a-z0-9]{2,4}$/i,'') : raw;

  s = s.replace(/\{[^}]*\}/g,' ').replace(/\[[^\]]*\]/g,' ').replace(/[._]+/g,' ').replace(/\s+/g,' ').trim();
  s = s.replace(/\b(extended(?: cut| edition)?|unrated|director'?s cut|remastered|theatrical cut|ultimate cut|final cut)\b/ig,' ');
  const ti = s.search(TAGS); if(ti > 0) s = s.slice(0, ti);

  for(const m of s.matchAll(/\(?\b((?:19|20)\d{2})\b\)?/g)){ if(m.index > 0 && +m[1] <= maxY){ y = +m[1]; cutAt = m.index; } }

function scanMovies(files, mode){
  const root = (files[0].webkitRelativePath || '').split('/')[0] || 'Movies';
  const units = new Map(); let nfiles = 0;
  for(const f of files){
    const path = f.webkitRelativePath || f.name;
    if(!VID.test(f.name) || EXTRA.test(path)) continue;
    nfiles++;
    const p = path.split('/');
    let cat, unit, isFolder;
    if(mode === 'genres'){
      if(p.length < 3){ cat = root; unit = f.name; isFolder = false; }
      else { cat = p[1]; isFolder = p.length >= 4; unit = isFolder ? p[2] : f.name; }
    } else { cat = root; isFolder = p.length >= 3; unit = isFolder ? p[1] : f.name; }
    const k = cat + '\u0000' + unit;
    if(!units.has(k)) units.set(k, {cat, unit, isFolder, files:[]});
    units.get(k).files.push(f);
  }
  const cats = {};
  for(const U of units.values()){
    const out = (cats[U.cat] ||= []);
    const fs = U.files.sort((a,b) => b.size - a.size);
    const pack = U.isFolder && fs.length > 1 && !(fs[0].size > 0 && fs[0].size > fs[1].size * 3);
    if(pack){
      const nums = fs.map(f => (f.name.match(/^\s*(\d{1,3})(?=[\s._)\-])/) || [])[1]).map(n => n == null ? null : +n);
      const got = nums.filter(n => n != null);
      const seq = got.length >= Math.max(2, Math.ceil(fs.length * .6)) && new Set(got).size === got.length && Math.max(...got) <= fs.length + 2;
      fs.forEach((f, i) => {

        const m = parseMovie(raw, true); out.push({...m, q:m.t, r:f.name});

    }
    else {
      let m = U.isFolder ? parseMovie(U.unit, false) : parseMovie(U.unit, true);
      if(U.isFolder && !m.y){ const fm = parseMovie(fs[0].name, true); if(fm.y && fold(fm.t)===fold(m.t)) m = fm; }
      out.push({...m, q:m.t, r:U.unit});
    }
  }

}
function scanTv(files){
  const root = (files[0].webkitRelativePath || '').split('/')[0] || 'TV Shows';
  const shows = {}; let nfiles = 0;

    const path = f.webkitRelativePath || f.name;
    if(!VID.test(f.name) || EXTRA.test(path)) continue;
    nfiles++;

    else raw = f.name.replace(/[ ._-]*(S\d{1,2}\s*E\d|\d{1,2}x\d{2}).*$/i,'') || p[0];

    (sv.movies||[]).forEach(it => add(it, 'movie', sv.name, {sp:A.img(sv, it.th), sg:it.g, sr:it.r, play:[{type:sv.type, label:A.label, url:A.play(sv, it.k)}]}));

/* ambient colour: the glass background picks up the colours of the poster you're on */
const AMB = {cache: new Map(), t: 0, key: ''};
function ambSet(c){ const a = $('#amb'); if(!a || !c) return; a.style.setProperty('--a1', c[0]); a.style.setProperty('--a2', c[1]); a.style.setProperty('--a3', c[2]); }

function ambSample(img){

  const cv = document.createElement('canvas'); cv.width = 4; cv.height = 9;
  const x = cv.getContext('2d', {willReadFrequently: true}); x.drawImage(img, 0, 0, 4, 9);
  const d = x.getImageData(0, 0, 4, 9).data, out = [];

    let r = 0, g = 0, b = 0; for(let i = band * 12 * 4; i < (band + 1) * 12 * 4; i += 4){ r += d[i]; g += d[i+1]; b += d[i+2]; }

    const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx + mn) / 510, dd = (mx - mn) / 255;

  if(img && img.complete && img.naturalWidth){

/* ================= DISCOVER: popular, upcoming, recent, essentials ================= */
const DISC = {kind: store.get('zn:dkind') || 'movie', sec: store.get('zn:dsec') || 'Popular', genre: store.get('zn:dgenre') || '', dec: store.get('zn:ddec') || '', hideOwn: store.get('zn:dhide') ?? false, busy:{}, err:{}};
if(DISC.sec === 'New Releases' || DISC.sec === 'Last 12 Months') DISC.sec = 'Recent';
/* Recent: how far back to look — 1, 3, 6, 9 or 12 months (one 12-month list is fetched, then trimmed) */
const RMONTHS = [1, 3, 6, 9, 12];
DISC.months = RMONTHS.includes(store.get('zn:dmonths')) ? store.get('zn:dmonths') : 12;
const recentCut = () => { const d = new Date(); d.setMonth(d.getMonth() - DISC.months); return isoDay(d); };
const recentItems = items => { const cut = recentCut(); return items.filter(x => !x.date || x.date >= cut); };
const monthsLabel = m => m === 1 ? '1 month' : `${m} months`;
const DMAP = new Map();
const DSECS = ['Popular','Upcoming','Recent'];
const GOAT = 'Essentials';
if(DISC.sec === 'The GOAT') DISC.sec = GOAT;
const ESS_ICO = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>';
const dsecs = () => DISC.genre ? [...DSECS, GOAT] : DSECS;
const DECADES = [2020, 2010, 2000, 1990, 1980, 1970, 1960, 1950];
const FILM_T = 'wd:Q11424 wd:Q24869 wd:Q29168811 wd:Q202866';
const TV_T = 'wd:Q5398426 wd:Q1259759 wd:Q581714 wd:Q526877 wd:Q63952888 wd:Q117467246';
/* Genres are matched by the English names of Wikidata's genre items (and all their sub-genres),
   e.g. Horror → "horror film" and everything under it (slasher film, zombie film, …). */
const DGEN = {
  'Action':['action', 'martial arts'], 'Adventure':['adventure'], 'Animation':['animated', 'animation'], 'Comedy':['comedy'],
  'Crime':['crime'], 'Documentary':['documentary'], 'Drama':['drama'], 'Family':['family', "children's"], 'Fantasy':['fantasy'],
  'History':['historical', 'biographical', 'period'], 'Horror':['horror'], 'Music':['musical', 'music'], 'Mystery':['mystery'],
  'Romance':['romance', 'romantic comedy'], 'Science Fiction':['science fiction'], 'Sport':['sports'], 'Superhero':['superhero'],
  'Thriller':['thriller'], 'War':['war'], 'Western':['Western', 'western']
};
const DGEN_TV = {Comedy:['sitcom', 'television comedy', 'comedy television series'], Drama:['television drama', 'drama television series'], Animation:['animated series', 'animated television series', 'adult animation'], Documentary:['documentary television series', 'docuseries'], Crime:['crime drama', 'police procedural'], Horror:['horror television', 'horror television series']};
function genreLabels(kind, g){
  const out = new Set();
  (DGEN[g] || []).forEach(b => {
    if(kind === 'movie'){ out.add(`${b} film`); if(b === "children's") out.add("children's film"); }
    else ['television series', 'television program', 'television', 'TV series', 'series'].forEach(s => out.add(`${b} ${s}`));
    out.add(`${b} film`);   // many TV series are tagged with the film genre too
  });
  if(kind === 'tv') (DGEN_TV[g] || []).forEach(l => out.add(l));
  if(g === 'Western') out.add('Western (genre)');
  return [...out];
}
function genreClause(kind, g){
  const vals = genreLabels(kind, g).map(l => `"${l.replace(/"/g, '\\"')}"@en`).join(' ');
  const core = `{ VALUES ?gl { ${vals} } ?groot rdfs:label ?gl . ?gsub wdt:P279* ?groot . ?f wdt:P136 ?gsub . }`;
  return g === 'Animation' && kind === 'movie' ? `{ ?f wdt:P31 wd:Q202866 } UNION ${core}` : core;
}
const isoDay = dt => dt.toISOString().slice(0,10);
const shiftDays = n => { const d = new Date(); d.setUTCDate(d.getUTCDate() + n); return d; };
const cleanArt = a => a.replace(/\s*\((\d{4} )?([A-Z][a-z]+ )*(film|TV series|television series|miniseries|series|animated series|web series)\)$/i, '').trim();
const dkey = (kind, sec, genre = DISC.genre, dec = DISC.dec) => `zn:disc:${kind}:${sec}${genre ? ':' + genre : ''}${sec === GOAT && dec ? ':' + dec : ''}`;
function discPrune(){   // keep the discover cache from growing without limit
  const ks = store.keys().filter(k => k.startsWith('zn:disc:')).map(k => [k, store.get(k)?.at || 0]).sort((a,b) => b[1] - a[1]);
  ks.slice(40).forEach(([k]) => store.del(k));
}
function fmtWhen(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00Z');
  if(iso.slice(5) === '01-01') return iso.slice(0,4);
  return d.toLocaleDateString(undefined, {month:'short', year:'numeric', timeZone:'UTC'});
}
async function discQuery(kind, sec, genre){
  const today = isoDay(new Date()), yrAgo = isoDay(shiftDays(-365)), yrOn = isoDay(shiftDays(400));
  const types = kind === 'movie' ? FILM_T : TV_T, dateP = kind === 'movie' ? 'wdt:P577' : 'wdt:P580|wdt:P577';
  const minSl = genre ? (kind === 'movie' ? (sec==='Upcoming' ? 2 : 4) : (sec==='Upcoming' ? 2 : 3)) : (kind === 'movie' ? (sec==='Upcoming' ? 6 : 10) : (sec==='Upcoming' ? 4 : 8));
  const range = sec === 'Upcoming'
    ? `FILTER(?d > "${today}T00:00:00Z"^^xsd:dateTime && ?d < "${yrOn}T00:00:00Z"^^xsd:dateTime) FILTER NOT EXISTS { ?f ${dateP} ?d0 . FILTER(?d0 <= "${today}T00:00:00Z"^^xsd:dateTime) }`
    : `FILTER(?d >= "${yrAgo}T00:00:00Z"^^xsd:dateTime && ?d <= "${today}T23:59:59Z"^^xsd:dateTime) FILTER NOT EXISTS { ?f ${dateP} ?d0 . FILTER(?d0 < "${yrAgo}T00:00:00Z"^^xsd:dateTime) }`;
  const rows = await sparql(`SELECT ?f (MIN(?d) AS ?date) (SAMPLE(?a) AS ?art) (MAX(?s) AS ?sl) WHERE {
    VALUES ?t { ${types} } ?f wdt:P31 ?t ; ${dateP} ?d ; wikibase:sitelinks ?s .
    FILTER(?s >= ${minSl}) ${range}
    ${genre ? genreClause(kind, genre) : ''}
    ?a schema:about ?f ; schema:isPartOf <https://en.wikipedia.org/> .
  } GROUP BY ?f ORDER BY DESC(?sl) LIMIT ${genre ? 120 : 90}`);
  return rows.map(r => {
    const art = artTitle(r.art.value), date = (r.date?.value || '').slice(0,10);
    return {q:qidOf(r.f.value), t:cleanArt(art), y:+date.slice(0,4) || null, date, art, s:kind, sl:+r.sl?.value || 0};
  }).sort((a,b) => sec === 'Upcoming' ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date));
}
async function discPopular(){
  let top = null;
  for(const back of [1,2,3]){
    const d = shiftDays(-back), p = `${d.getUTCFullYear()}/${String(d.getUTCMonth()+1).padStart(2,'0')}/${String(d.getUTCDate()).padStart(2,'0')}`;
    try{ top = await getJSON(`https://wikimedia.org/api/rest_v1/metrics/pageviews/top/en.wikipedia/all-access/${p}`); break; }catch(e){ if(back === 3) throw e; }
  }
  const arts = (top.items?.[0]?.articles || []).filter(a => !/^(Main_Page|Special:|Wikipedia:|Portal:|File:|Help:|Category:|Template:|Talk:|User:)/.test(a.article)).slice(0, 1000)
    .map(a => ({title:a.article.replace(/_/g,' '), rank:a.rank}));
  const byTitle = {};
  for(const c of chunk(arts.map(a => a.title), 50)){
    const j = await wqr({action:'query', titles:c.join('|'), redirects:'1', prop:'pageprops', ppprop:'wikibase_item'});
    const nm = {}, rd = {}, pg = {};
    (j.query?.normalized||[]).forEach(x => nm[x.from] = x.to);
    (j.query?.redirects||[]).forEach(x => rd[x.from] = x.to);
    (j.query?.pages||[]).forEach(p => pg[p.title] = p);
    c.forEach(tt => { let x = nm[tt] || tt; x = rd[x] || x; const p = pg[x]; if(p?.pageprops?.wikibase_item) byTitle[tt] = {q:p.pageprops.wikibase_item, art:p.title}; });
    await sleep(150);
  }
  const qs_ = uniq(Object.values(byTitle).map(v => v.q)), kinds = {};
  for(const c of chunk(qs_, 250)){
    const rows = await sparql(`SELECT ?f ?k (MIN(?d) AS ?date) WHERE { VALUES ?f { ${c.map(q => 'wd:'+q).join(' ')} }
      { VALUES ?t { ${FILM_T} } ?f wdt:P31 ?t . BIND("movie" AS ?k) OPTIONAL { ?f wdt:P577 ?d } }
      UNION { VALUES ?t2 { ${TV_T} } ?f wdt:P31 ?t2 . BIND("tv" AS ?k) OPTIONAL { ?f wdt:P580|wdt:P577 ?d } } } GROUP BY ?f ?k`);
    rows.forEach(r => { kinds[qidOf(r.f.value)] = {k:r.k.value, date:(r.date?.value||'').slice(0,10)}; });
  }
  const out = {movie:[], tv:[]}, seen = new Set();
  arts.forEach(a => { const b = byTitle[a.title]; if(!b || seen.has(b.q)) return; const k = kinds[b.q]; if(!k) return; seen.add(b.q);
    out[k.k].push({q:b.q, t:cleanArt(b.art), y:+k.date.slice(0,4) || null, date:k.date, art:b.art, s:k.k}); });
  out.movie = out.movie.slice(0, 300).map((x,i) => ({...x, rank:i+1})); out.tv = out.tv.slice(0, 300).map((x,i) => ({...x, rank:i+1}));
  return out;
}
async function discPopularGenre(kind, genre){
  let base = store.get(dkey(kind, 'Popular', ''));
  if(!base || Date.now() - base.at > 6*3600e3){ const r = await discPopular(), at = Date.now(); store.set(dkey('movie','Popular',''), {at, items:r.movie}); store.set(dkey('tv','Popular',''), {at, items:r.tv}); base = store.get(dkey(kind, 'Popular', '')); }
  const keep = new Set();
  for(const c of chunk(base.items.map(x => x.q), 150)){
    const rows = await sparql(`SELECT DISTINCT ?f WHERE { VALUES ?f { ${c.map(q => 'wd:'+q).join(' ')} } ${genreClause(kind, genre)} }`);
    rows.forEach(r => keep.add(qidOf(r.f.value)));
  }
  return base.items.filter(x => keep.has(x.q)).map((x, i) => ({...x, rank:i+1}));
}
/* Essentials: the best-regarded titles in a genre. Score = critics (Rotten Tomatoes / Metacritic scores
   recorded on Wikidata) blended with how widely the title is covered (Wikipedia language editions). */
async function discGoat(kind, genre, dec){
  const types = kind === 'movie' ? FILM_T : TV_T, dateP = kind === 'movie' ? 'wdt:P577' : 'wdt:P580|wdt:P577';
  const minSl = dec ? (kind === 'movie' ? 8 : 5) : (kind === 'movie' ? 15 : 10);
  const range = dec ? `FILTER(?d >= "${dec}-01-01T00:00:00Z"^^xsd:dateTime && ?d < "${+dec + 10}-01-01T00:00:00Z"^^xsd:dateTime)` : `FILTER(?d < "${isoDay(new Date())}T00:00:00Z"^^xsd:dateTime)`;
  const rows = await sparql(`SELECT ?f (MIN(?d) AS ?date) (SAMPLE(?a) AS ?art) (MAX(?s) AS ?sl) (GROUP_CONCAT(DISTINCT ?rt; separator="|") AS ?rts) (GROUP_CONCAT(DISTINCT ?mc; separator="|") AS ?mcs) WHERE {
    ${genreClause(kind, genre)}
    VALUES ?t { ${types} } ?f wdt:P31 ?t ; wikibase:sitelinks ?s .
    FILTER(?s >= ${minSl})
    ?f ${dateP} ?d . ${range}
    ?a schema:about ?f ; schema:isPartOf <https://en.wikipedia.org/> .
    OPTIONAL { ?f p:P444 ?s1 . ?s1 pq:P447 wd:Q105584 ; ps:P444 ?rt . }
    OPTIONAL { ?f p:P444 ?s2 . ?s2 pq:P447 wd:Q150248 ; ps:P444 ?mc . }
  } GROUP BY ?f ORDER BY DESC(?sl) LIMIT 600`);
  const pct = v => { const m = /(\d+(?:\.\d+)?)\s*(?:%|\/\s*(\d+))?/.exec(v || ''); if(!m) return null; const n = +m[1], of = m[2] ? +m[2] : 100; return of ? Math.round(n / of * 100) : null; };
  const best = s => { const raw = (s || '').split('|').filter(Boolean), pc = raw.filter(v => /%/.test(v)); const vs = (pc.length ? pc : raw).map(pct).filter(v => v != null && v <= 100); return vs.length ? Math.max(...vs) : null; };   // Tomatometer % over average rating
  let items = rows.map(r => {
    const art = artTitle(r.art.value), date = (r.date?.value || '').slice(0,10);
    const rt = best(r.rts?.value), mc = best(r.mcs?.value);
    return {q:qidOf(r.f.value), t:cleanArt(art), y:+date.slice(0,4) || null, date, art, s:kind, sl:+r.sl?.value || 0, rt, mc};
  }).filter(x => x.y);
  if(!items.length) return [];
  const ls = items.map(x => Math.log(x.sl)), lo = Math.min(...ls), hi = Math.max(...ls);
  items.forEach(x => {
    const pop = hi > lo ? (Math.log(x.sl) - lo) / (hi - lo) * 100 : 50;
    const critics = [x.rt, x.mc].filter(v => v != null);
    const crit = critics.length ? critics.reduce((a, b) => a + b, 0) / critics.length : null;
    x.score = crit != null ? crit * 0.6 + pop * 0.4 : pop * 0.75;   // titles without critic scores rank lower
  });
  return items.sort((a, b) => b.score - a.score).slice(0, 100).map((x, i) => ({...x, rank:i+1}));
}
const discMaxAge = sec => sec === 'Popular' ? 6*3600e3 : sec === GOAT ? 7*24*3600e3 : 24*3600e3;

  if(DISC.busy[key]) return;

const PWD = 'https://discover.provider.plex.tv';

const pwSave = () => store.set('zn:plexuser', {token:PW.token, name:PW.name, thumb:PW.thumb, keys:PW.keys, items:PW.items, at:PW.at});
const pwKey = (t, y, s) => `${s==='tv' ? 'tv' : 'movie'}|${fold(t)}|${y || ''}`;

/* Watchlist requests: auth goes in the query string and only Accept is sent as a header,
   so GETs are "simple" CORS requests (no preflight). Tries the current Discover host, then the older metadata host. */
const PW_HOSTS = ['https://discover.provider.plex.tv', 'https://metadata.provider.plex.tv'];
function pwParseXML(txt){
  const doc = new DOMParser().parseFromString(txt, 'text/xml'), mc = doc.querySelector('MediaContainer');
  if(!mc) throw new Error('Unexpected reply from Plex');
  const at = el => Object.fromEntries([...el.attributes].map(a => [a.name, a.value]));
  const md = [...mc.children].filter(el => /^(Video|Directory|Metadata)$/.test(el.tagName)).map(el => { const o = at(el); if(o.year) o.year = +o.year; if(o.addedAt) o.addedAt = +o.addedAt; return o; });
  return {MediaContainer:{...at(mc), totalSize:+(mc.getAttribute('totalSize') || mc.getAttribute('size') || md.length), Metadata:md}};
}
async function pwReq(path, params = {}, method = 'GET', ms = 15000){
  const auth = {'X-Plex-Token':PW.token, 'X-Plex-Client-Identifier':CID, 'X-Plex-Product':'YAMZ', 'X-Plex-Platform':'Web'};
  const hosts = PW.host ? [PW.host, ...PW_HOSTS.filter(h => h !== PW.host)] : PW_HOSTS;
  let last;
  for(const h of hosts){
    try{
      const r = await fetchT(`${h}${path}?${qs({...params, ...auth})}`, {method, headers:{Accept:'application/json'}}, ms);
      if(r.status === 401){ const e = new Error('HTTP 401'); e.status = 401; throw e; }
      if(!r.ok){ last = new Error(`HTTP ${r.status} from ${new URL(h).host}`); last.status = r.status; continue; }
      PW.host = h;
      if(method !== 'GET') return true;
      const txt = await r.text();
      if(!txt.trim()) return {MediaContainer:{}};
      return /^\s*</.test(txt) ? pwParseXML(txt) : JSON.parse(txt);
    }catch(e){ if(e.status === 401) throw e; last = e; }
  }
  throw last || new Error('No reply from Plex');
}
async function pwSetToken(token){

function pwDisconnect(){ Object.assign(PW, {token:null, name:null, thumb:null, keys:{}, items:[], at:0}); pwSave(); pwMarks(); renderConn(); pwView(); }

/* ================= RADARR / SONARR =================
   Talks only to the documented Radarr/Sonarr v3 API on the user's own server:
   system/status, qualityprofile, rootfolder, tag, languageprofile (Sonarr v3), movie|series (list),
   movie|series/lookup and POST movie|series. What happens after a title is added is up to the user's server. */
const ARR_SVCS = ['radarr', 'sonarr'];
const ARR_DEF = {
  radarr:{id:'radarr', name:'Radarr', kind:'movie', port:7878, color:'#ffc230', item:'movie', items:'movies', lookup:'/api/v3/movie/lookup', lib:'/api/v3/movie', idName:'TMDB'},
  sonarr:{id:'sonarr', name:'Sonarr', kind:'tv', port:8989, color:'#35c5f4', item:'series', items:'series', lookup:'/api/v3/series/lookup', lib:'/api/v3/series', idName:'TheTVDB'}
};
const ARR_ICON = {
  radarr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="11" rx="2"/><path d="M3.5 9l1.6-4.2 15.4 0L21 9M9 4.8L7.5 9M15 4.8L13.5 9"/></svg>',
  sonarr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6.5" width="18" height="12.5" rx="2"/><path d="M8 3l4 3.5L16 3M9 22h6"/></svg>'
};
const ARR_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ARR_SPIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></svg>';
const ARR = store.get('zn:arr') || {};
const arrSave = () => store.set('zn:arr', ARR);
const ARRLIB = {radarr:store.get('zn:arrlib:radarr') || null, sonarr:store.get('zn:arrlib:sonarr') || null};   // {k:{key:id}, info:{id:[slug,hasFile]}, n, at}
const ARR_FORM = {radarr:{}, sonarr:{}};
const arrFor = s => s === 'tv' ? 'sonarr' : 'radarr';
const arrOn = svc => !!(ARR[svc]?.url && ARR[svc]?.key);
const arrTKey = (t, y) => `t|${fold(t)}|${y || ''}`;
const fmtBytes = n => !n && n !== 0 ? '' : n >= 1e12 ? (n/1e12).toFixed(1)+' TB' : n >= 1e9 ? Math.round(n/1e9)+' GB' : Math.round(n/1e6)+' MB';

class ArrError extends Error{ constructor(msg, code, extra){ super(msg); this.code = code; Object.assign(this, extra || {}); } }

function arrValidate(urlIn, keyIn){
  const errs = {};
  let url = (urlIn || '').trim();
  if(!url) errs.url = 'Enter your server address, e.g. http://192.168.1.10:7878';
  else {
    if(!/^https?:\/\//i.test(url)) url = 'http://' + url;
    try{ const u = new URL(url); if(!u.hostname || /\s/.test(urlIn.trim())) throw 0; url = (u.origin + u.pathname).replace(/\/+$/, '').replace(/\/api(\/v\d)?$/i, ''); }
    catch{ errs.url = "That doesn't look like a valid address. Use something like http://192.168.1.10:7878"; }
  }
  const key = (keyIn || '').trim();
  if(!key) errs.key = 'Paste your API key.';
  else if(!/^[a-f0-9]{32}$/i.test(key)) errs.key = 'API keys are 32 characters (0–9 and a–f). Copy it from Settings → General → Security.';
  return {url, key, errs};
}

async function arrReq(svc, path, {method = 'GET', body, params, conf} = {}){
  const c = conf || ARR[svc], D = ARR_DEF[svc];
  if(!c?.url || !c?.key) throw new ArrError(`${D.name} isn't connected. Add it in Settings → Connections.`, 'config');
  const q = params ? '?' + qs(params) : '';
  const opts = {method, headers:{'X-Api-Key':c.key, Accept:'application/json', ...(body ? {'Content-Type':'application/json'} : {})}, ...(body ? {body:JSON.stringify(body)} : {})};
  let r;
  try{ r = await fetchT(c.url + path + q, opts, method === 'GET' ? 25000 : 30000); }
  catch(e){
    // A GET can retry with the key as a query parameter (no CORS preflight needed).
    if(method === 'GET'){ try{ r = await fetchT(c.url + path + '?' + qs({...(params || {}), apikey:c.key}), {headers:{Accept:'application/json'}}, 25000); }catch{} }
    if(!r) throw new ArrError(`Couldn't reach ${D.name} at ${c.url}. Check the address and port, that ${D.name} is running, and that this computer is on the same network.`, 'net');
  }
  const txt = await r.text(); let data = null;
  try{ data = txt ? JSON.parse(txt) : null; }catch{}
  if(r.ok){
    if(data === null && /<html|<!doctype/i.test(txt)) throw new ArrError(`That address answered with a web page, not the ${D.name} API. If ${D.name} uses a URL base (like /${svc}), include it in the address.`, 'notapi');
    return data;
  }
  if(r.status === 401 || r.status === 403) throw new ArrError(`${D.name} rejected the API key. Copy it again from ${D.name} → Settings → General → Security.`, 'auth', {status:r.status});
  if(r.status === 404) throw new ArrError(`${D.name} answered but doesn't have ${path}. Check the address includes any URL base, and that ${D.name} is up to date (v3 or newer).`, 'notfound', {status:404});
  if(r.status === 400 || r.status === 409){
    const list = Array.isArray(data) ? data : data?.errors ? Object.values(data.errors).flat().map(m => ({errorMessage:m})) : [];
    const all = list.map(x => `${x.errorCode || ''} ${x.errorMessage || ''}`).join(' ');
    if(r.status === 409 || /ExistsValidator|already been added|already exists/i.test(all)) throw new ArrError(`Already in ${D.name}.`, 'exists', {status:r.status});
    const msgs = uniq(list.map(x => x.errorMessage).filter(Boolean));
    throw new ArrError(`${D.name} didn't accept that: ${msgs.join(' ') || data?.message || 'validation failed'}`, 'invalid', {status:r.status});
  }
  const msg = data?.message || data?.title || (typeof data === 'string' ? data : '') || r.statusText || '';
  throw new ArrError(`${D.name} returned an error (HTTP ${r.status})${msg ? ': ' + msg : ''}.`, 'http', {status:r.status});
}

async function arrMeta(svc){
  const c = ARR[svc], v3 = svc === 'sonarr' && /^3\./.test(c.ver || '');
  const [profiles, roots, tags, langs] = await Promise.all([
    arrReq(svc, '/api/v3/qualityprofile'), arrReq(svc, '/api/v3/rootfolder'),
    arrReq(svc, '/api/v3/tag').catch(() => []),
    v3 ? arrReq(svc, '/api/v3/languageprofile').catch(() => []) : Promise.resolve([])]);
  c.profiles = (profiles || []).map(p => ({id:p.id, name:p.name}));
  c.roots = (roots || []).map(r => ({id:r.id, path:r.path, free:r.freeSpace, ok:r.accessible !== false}));
  c.tags = (tags || []).map(x => ({id:x.id, label:x.label}));
  c.langs = (langs || []).map(l => ({id:l.id, name:l.name}));
  c.metaAt = Date.now(); arrSave();
}

async function arrConnect(svc, urlIn, keyIn){
  const D = ARR_DEF[svc], F = ARR_FORM[svc];
  const v = arrValidate(urlIn, (keyIn || '').trim() || (F.edit ? ARR[svc]?.key : ''));
  Object.assign(F, {url:urlIn, key:keyIn, errs:v.errs, err:null, warn:null});
  if(Object.keys(v.errs).length) return renderConn();
  if(inPreview){ F.err = 'Open the file in your web browser — previews block network access.'; return renderConn(); }
  F.busy = true; renderConn();
  const conf = {url:v.url, key:v.key};
  try{
    const st = await arrReq(svc, '/api/v3/system/status', {conf});
    if(!st || !st.version) throw new ArrError(`That address didn't respond like ${D.name}.`, 'notapi');
    const app = st.appName || '';
    if(app && !new RegExp(D.name, 'i').test(app)) throw new ArrError(`That's a ${app} server, not ${D.name}. Check the port (${D.name} normally uses ${D.port}).`, 'wrongapp');
    const keep = ARR[svc]?.url === v.url ? ARR[svc] : {};
    ARR[svc] = {last:keep.last, quick:keep.quick, ...conf, ver:st.version, app:app || D.name};
    await arrMeta(svc);
    if(!ARR[svc].roots.length) F.warn = `${D.name} has no root folders yet. Add one in ${D.name} → Settings → Media Management before adding ${D.items}.`;
    else if(!ARR[svc].profiles.length) F.warn = `${D.name} has no quality profiles. Add one in ${D.name} → Settings → Profiles.`;
    arrSave(); Object.assign(F, {errs:{}, key:'', url:undefined, edit:false});
    if(ARRLIB[svc] && keep !== ARR[svc] && !keep.url){ ARRLIB[svc] = null; }
    toast(`✓ Connected to ${D.name} ${st.version}.`);
    arrSync(svc, true); render();
  }catch(e){ F.err = e.message; if(e.code === 'auth') F.errs = {key:'Rejected by the server.'}; }
  finally{ F.busy = false; renderConn(); }
}
function arrDisconnect(svc){
  delete ARR[svc]; arrSave(); ARRLIB[svc] = null; store.del('zn:arrlib:' + svc); ARR_FORM[svc] = {};
  renderConn(); render(); toast(`${ARR_DEF[svc].name} disconnected.`);
}

async function arrSync(svc, force){
  if(!arrOn(svc) || inPreview) return;
  const L = ARRLIB[svc], F = ARR_FORM[svc];
  if(!force && L && Date.now() - L.at < 10*60e3) return;
  if(F.syncing) return; F.syncing = true;
  try{
    const all = await arrReq(svc, ARR_DEF[svc].lib) || [];
    const k = {}, info = {};
    all.forEach(m => {
      info[m.id] = [m.titleSlug || '', svc === 'radarr' ? (m.hasFile ? 1 : 0) : (m.statistics?.percentOfEpisodes ?? null)];
      if(m.tmdbId) k['tmdb:' + m.tmdbId] = m.id; if(m.imdbId) k['imdb:' + m.imdbId] = m.id; if(m.tvdbId) k['tvdb:' + m.tvdbId] = m.id;
      k[arrTKey(m.title, m.year)] = m.id; if(!k[arrTKey(m.title, '')]) k[arrTKey(m.title, '')] = m.id;
    });
    ARRLIB[svc] = {k, info, n:all.length, at:Date.now()};
    store.set('zn:arrlib:' + svc, ARRLIB[svc]); F.syncErr = null; arrMarks();
  }catch(e){ console.warn(`${svc} library sync failed`, e); F.syncErr = e.message; }
  finally{ F.syncing = false; if($('#sov').classList.contains('open')) renderConn(); }
}
function arrRemember(svc, m){
  if(!m) return;
  const L = ARRLIB[svc] || (ARRLIB[svc] = {k:{}, info:{}, n:0, at:0}), id = m.id || ('new' + (m.tmdbId || m.tvdbId));
  if(!L.info[id]) L.n++;
  L.info[id] = [m.titleSlug || '', 0];
  if(m.tmdbId) L.k['tmdb:' + m.tmdbId] = id; if(m.imdbId) L.k['imdb:' + m.imdbId] = id; if(m.tvdbId) L.k['tvdb:' + m.tvdbId] = id;
  L.k[arrTKey(m.title, m.year)] = id; if(!L.k[arrTKey(m.title, '')]) L.k[arrTKey(m.title, '')] = id;
  store.set('zn:arrlib:' + svc, L);
}
function arrHas(it){
  const svc = arrFor(it.s), L = ARRLIB[svc]; if(!L) return null;
  const ids = it.ids || {}, K = L.k;
  let id = null;
  for(const n of ['tmdb', 'tvdb', 'imdb']) if(ids[n] && K[n + ':' + ids[n]]){ id = K[n + ':' + ids[n]]; break; }
  if(!id && it.y) for(const y of [it.y, it.y - 1, it.y + 1]){ if(K[arrTKey(it.t, y)]){ id = K[arrTKey(it.t, y)]; break; } }
  if(!id && !it.y) id = K[arrTKey(it.t, '')];
  return id ? {id, slug:L.info[id]?.[0] || ''} : null;
}
function arrOpenIn(svc, v){
  const u = `${ARR[svc].url}/${svc === 'radarr' ? 'movie' : 'series'}/${encodeURIComponent(v.slug || '')}`;
  if(v.slug) open(u, '_blank', 'noopener'); else toast(`Already in ${ARR_DEF[svc].name}.`);

/* external ids help the lookup land on the exact title */
const ARRID = new Map();
function arrItem(it){
  const out = {...it};
  const pm = /^w:p(.+)$/.exec(it.k || ''); if(pm){ const w = PW.items.find(x => x.rk === pm[1]); if(w) out.ids = {...(w.ids || {}), ...(it.ids || {})}; }
  const qm = /^w:(Q\d+)$/.exec(it.k || ''); if(qm && !out.q) out.q = qm[1];
  return out;
}
async function arrIds(it){
  const ids = {...(it.ids || {})};
  if(it.q && !(ids.tmdb || ids.tvdb)){
    if(!ARRID.has(it.q)){
      try{
        const cl = (await Promise.race([wd({action:'wbgetentities', ids:it.q, props:'claims'}), sleep(6000).then(() => { throw new Error('timeout'); })])).entities?.[it.q]?.claims || {};
        const v = p => cl[p]?.[0]?.mainsnak?.datavalue?.value;
        ARRID.set(it.q, {tmdb:it.s === 'tv' ? null : v('P4947'), tvdb:v('P4835'), imdb:v('P345')});
      }catch{ ARRID.set(it.q, {}); }
    }
    Object.entries(ARRID.get(it.q)).forEach(([k, x]) => { if(x && !ids[k]) ids[k] = String(x); });
  }
  return ids;
}
async function arrLookup(svc, it){
  const D = ARR_DEF[svc], ids = await arrIds(it); it.ids = ids;
  let res = [], exact = false;
  const idTerm = svc === 'radarr' ? (ids.tmdb ? 'tmdb:' + ids.tmdb : ids.imdb ? 'imdb:' + ids.imdb : null) : (ids.tvdb ? 'tvdb:' + ids.tvdb : null);
  if(idTerm){
    try{ res = (await arrReq(svc, D.lookup, {params:{term:idTerm}})) || []; exact = res.length > 0; }
    catch(e){ if(!['notfound', 'http', 'invalid'].includes(e.code)) throw e; }
  }
  if(!res.length) res = (await arrReq(svc, D.lookup, {params:{term:it.t}})) || [];
  if(!Array.isArray(res)) res = [res];
  res = res.filter(m => m && (svc === 'radarr' ? m.tmdbId : m.tvdbId));
  const sc = m => (exact ? 10 : 0) + (fold(m.title) === fold(it.t) ? 4 : 0) + (it.y && m.year === it.y ? 3 : it.y && m.year && Math.abs(m.year - it.y) <= 1 ? 2 : 0) - (m.year ? 0 : 1);
  res.sort((a, b) => sc(b) - sc(a));
  const sure = res.length > 0 && (exact || (sc(res[0]) >= 6 && (!res[1] || sc(res[1]) < sc(res[0]))));
  return {list:res.slice(0, 15), sure};
}

async function arrSubmit(){
  const A = ADD; if(!A || A.busy) return;
  const svc = A.svc, D = ARR_DEF[svc], c = ARR[svc], m = A.list[A.sel], f = A.form;
  const errs = [];
  if(!m) errs.push(`Pick a ${D.item} first.`);

  const root = c.roots.find(r => r.path === f.root);
  if(!root) errs.push(`Choose a root folder${c.roots.length ? '' : ` (add one in ${D.name} → Settings → Media Management)`}.`);
  else if(!root.ok) errs.push(`${D.name} reports that ${root.path} isn't accessible right now. Choose another root folder or fix it in ${D.name}.`);

  if(svc === 'sonarr' && c.langs.length && !c.langs.some(l => String(l.id) === String(f.lang))) errs.push('Choose a language profile.');
  if(errs.length){ A.err = errs.join(' '); if(!$('#aov').classList.contains('open')) arrShow(); else renderAdd(); return; }
  A.busy = true; A.err = null; renderAdd();

  const body = svc === 'radarr'
    ? {...base, title:m.title, tmdbId:m.tmdbId, year:m.year, qualityProfileId:+f.profile, rootFolderPath:f.root, monitored:true, minimumAvailability:f.minAvail, tags:f.tags, addOptions:{searchForMovie:!!f.search, monitor:'movieOnly'}}
