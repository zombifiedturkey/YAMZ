    if(!$('#aov').classList.contains('open')) arrShow(); else renderAdd();
  }
}

/* ================= CALENDAR: release dates for titles in Radarr/Sonarr, your lists and Plex Watchlist ================= */
const CAL = {
  kind: store.get('zn:ckind') || 'movie', view: store.get('zn:cview') || (innerWidth < 700 ? 'agenda' : 'month'), month: null,
  src: Object.assign({arr:true, lists:true, wl:true, lib:false}, store.get('zn:csrc') || {}),
  types: Object.assign({cinema:true, digital:true, physical:true, release:true, premiere:true, episode:true, finale:true}, store.get('zn:ctypes') || {}),
  busy:false, prog:'', err:{}, arr:{}, evs:[]
};
const CTYPE = {
  cinema:['Theatres', '#e8b04b'], digital:['Streaming', '#4aa3ff'], physical:['Physical media', '#b67cff'], release:['Release', '#8f96a3'],
  premiere:['Premiere', '#5fb57d'], episode:['New episode', '#4aa3ff'], finale:['Finale', '#e0645a']
};
const CTYPES_FOR = {movie:['cinema', 'digital', 'physical', 'release'], tv:['premiere', 'episode', 'finale']};
const REGION = ((navigator.language || 'en-US').split('-')[1] || 'US').toUpperCase();
const REGION_Q = {AU:'Q408', US:'Q30', GB:'Q145', NZ:'Q664', CA:'Q16', IE:'Q27', DE:'Q183', FR:'Q142', NL:'Q55', SE:'Q34', ES:'Q29', IT:'Q38'};
const ymd = dt => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
const fromYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (dt, n) => { const x = new Date(dt); x.setDate(x.getDate() + n); return x; };
const todayY = () => ymd(new Date());
const calMonth = () => CAL.month || todayY().slice(0, 7);
function calRange(){
  if(CAL.view === 'agenda'){ const t = new Date(); return {start:ymd(addDays(t, -7)), end:ymd(addDays(t, 180))}; }
  const first = fromYmd(calMonth() + '-01'), lead = (first.getDay() + 6) % 7;   // Monday-first grid
  const start = addDays(first, -lead);
  return {start:ymd(start), end:ymd(addDays(start, 41))};
}
const calSave = () => { store.set('zn:ckind', CAL.kind); store.set('zn:cview', CAL.view); store.set('zn:csrc', CAL.src); store.set('zn:ctypes', CAL.types); };
let calT; const calPaint = () => { clearTimeout(calT); calT = setTimeout(() => { if(state.s === 'calendar'){ renderSide(); render(); } }, 250); };
const tmdbOn = () => cfg.prov === 'tmdb' && !!cfg.key;
const tmdbImg = p => p ? 'https://image.tmdb.org/t/p/w185' + p : null;

/* ---- Radarr / Sonarr calendars ---- */
async function calArr(svc, start, end){
  const img = m => (m.images || []).find(i => i.coverType === 'poster')?.remoteUrl || null;
  const s = new Date(start + 'T00:00:00').toISOString(), e = new Date(end + 'T23:59:59').toISOString();
  if(svc === 'radarr'){
    const list = await arrReq(svc, '/api/v3/calendar', {params:{start:s, end:e, unmonitored:'true'}}) || [];
    return list.flatMap(m => [['inCinemas', 'cinema'], ['digitalRelease', 'digital'], ['physicalRelease', 'physical']].filter(([f]) => m[f])
      .map(([f, type]) => ({d:m[f].slice(0, 10), type, t:m.title, y:m.year, s:'movie', poster:img(m), src:'Radarr', have:!!m.hasFile, ids:{tmdb:m.tmdbId, imdb:m.imdbId}})));
  }
  const list = await arrReq(svc, '/api/v3/calendar', {params:{start:s, end:e, unmonitored:'true', includeSeries:'true'}}) || [];
  return list.filter(x => x.airDateUtc || x.airDate).map(x => {
    const se = x.series || {}, d = x.airDateUtc ? ymd(new Date(x.airDateUtc)) : x.airDate;
    const type = x.episodeNumber === 1 ? 'premiere' : x.finaleType ? 'finale' : 'episode';
    return {d, type, t:se.title || 'Unknown series', y:se.year, s:'tv', poster:img(se), src:'Sonarr', have:!!x.hasFile, net:se.network || '',
      sub:`S${String(x.seasonNumber).padStart(2, '0')}E${String(x.episodeNumber).padStart(2, '0')}${x.title && x.title !== 'TBA' ? ' · ' + x.title : ''}`, ids:{tvdb:se.tvdbId}};
  });
}

/* ---- titles from your lists, Plex Watchlist and (TV) library ---- */
function calCands(kind){
  const out = new Map(), yNow = new Date().getFullYear();
  const add = (it, from) => {
    if((it.s || 'movie') !== kind) return;
    if(kind === 'movie' && it.y && it.y < yNow - 1) return;     // old films have no upcoming releases
    const k = fold(it.t) + '|' + (it.y || '');
    const cur = out.get(k);
    if(cur){ if(!cur.from.includes(from)) cur.from.push(from); if(it.ids) cur.ids = {...it.ids, ...(cur.ids || {})}; if(!cur.q && it.q) cur.q = it.q; return; }
    out.set(k, {t:it.t, y:it.y || null, s:kind, ids:it.ids || {}, q:it.q || (/^w:(Q\d+)$/.exec(it.k || '') || [])[1] || null, poster:it.poster || null, from:[from]});
  };
  if(CAL.src.lists) LISTS.forEach(L => L.items.forEach(it => add(it, L.name)));
  if(CAL.src.wl && PW.token) PW.items.forEach(it => add(it, 'Plex Watchlist'));
  if(kind === 'tv' && CAL.src.lib) DATA.filter(d => d.s === 'tv').forEach(d => add({t:d.t, y:d.y, s:'tv', ids:d.ids}, 'Your library'));
  return [...out.values()].slice(0, kind === 'tv' ? 150 : 200);
}
const calKey = it => `zn:cal:${it.s}:${fold(it.t)}|${it.y || ''}${it.s === 'movie' ? (tmdbOn() ? ':t' : ':w') : ''}`;

async function calMovieTmdb(it){
  let id = it.ids?.tmdb, poster = null;
  if(!id){
    const j = await getJSON(TMDB.url('/search/movie', {query:it.t, year:it.y || '', include_adult:'false'}), TMDB.opts());
    const r = (j.results || []).find(x => fold(x.title) === fold(it.t)) || j.results?.[0];
    if(!r) return {ev:[]};
    id = r.id; poster = tmdbImg(r.poster_path);
  }
  const rd = await getJSON(TMDB.url(`/movie/${id}/release_dates`), TMDB.opts());
  const by = Object.fromEntries((rd.results || []).map(r => [r.iso_3166_1, r.release_dates || []]));
  const dates = by[REGION] || by.US || Object.values(by)[0] || [];
  const best = {};
  dates.forEach(x => {
    const type = x.type === 4 ? 'digital' : x.type === 5 ? 'physical' : (x.type === 2 || x.type === 3) ? 'cinema' : null;
    if(!type || !x.release_date) return;
    const d = x.release_date.slice(0, 10);
    if(!best[type] || d < best[type].d) best[type] = {d, note:x.note || ''};
  });
  return {ev:Object.entries(best).map(([type, v]) => ({d:v.d, type, note:v.note})), poster, region:by[REGION] ? REGION : 'US'};
}
async function calMoviesWikidata(items){
  const need = items.filter(it => !it.q && it.ids?.imdb);
  if(need.length){ const m = await imdbToQ(need.map(it => it.ids.imdb)); need.forEach(it => { if(m[it.ids.imdb]) it.q = m[it.ids.imdb].q; }); }
  const withQ = items.filter(it => it.q), res = new Map();
  for(const c of chunk(withQ, 120)){
    const rows = await sparql(`SELECT ?f ?d ?place WHERE { VALUES ?f { ${c.map(it => 'wd:' + it.q).join(' ')} } ?f p:P577 ?st . ?st ps:P577 ?d . OPTIONAL { ?st pq:P291 ?place } }`);
    rows.forEach(r => { const q = qidOf(r.f.value); if(!res.has(q)) res.set(q, []); res.get(q).push({d:(r.d.value || '').slice(0, 10), place:r.place ? qidOf(r.place.value) : null}); });
  }
  const rq = REGION_Q[REGION];
  items.forEach(it => {
    const ds = (it.q && res.get(it.q) || []).filter(x => /^\d{4}-\d\d-\d\d$/.test(x.d) && !x.d.endsWith('-01-01'));
    const pick = ds.filter(x => x.place === rq).sort((a, b) => a.d.localeCompare(b.d))[0] || ds.filter(x => !x.place).sort((a, b) => a.d.localeCompare(b.d))[0] || ds.filter(x => x.place === 'Q30').sort((a, b) => a.d.localeCompare(b.d))[0];
    store.set(calKey(it), {at:Date.now(), ev:pick ? [{d:pick.d, type:'release'}] : [], src:'Wikidata'});
  });
}
async function calShow(it){
  const id = await tvmazeId({t:it.t, q:it.t, y:it.y, ids:it.ids || {}, s:'tv'});
  if(!id) return {ev:[]};
  const s = await tvGet(`https://api.tvmaze.com/shows/${id.id}?embed[]=episodes&embed[]=seasons`);
  const order = {}; (s._embedded?.seasons || []).forEach(x => order[x.number] = x.episodeOrder || null);
  const net = s.webChannel?.name ? `Streaming · ${s.webChannel.name}` : s.network?.name ? `TV · ${s.network.name}` : '';
  const from = ymd(addDays(new Date(), -45));
  const ev = (s._embedded?.episodes || []).filter(e => (e.airstamp || e.airdate) && e.number != null).map(e => {
    const d = e.airstamp ? ymd(new Date(e.airstamp)) : e.airdate;
    const type = e.number === 1 ? 'premiere' : order[e.season] && e.number === order[e.season] ? 'finale' : 'episode';
    return {d, type, sub:`S${String(e.season).padStart(2, '0')}E${String(e.number).padStart(2, '0')}${e.name ? ' · ' + e.name : ''}`};
  }).filter(e => e.d >= from).slice(0, 80);
  return {ev, net, poster:s.image?.medium || null};
}

async function calLoad(force){
  if(CAL.busy) return;
  if(inPreview){ CAL.err.net = 'Open the file in your web browser — previews block internet access.'; return calPaint(); }
  CAL.busy = true; CAL.err.list = null;
  const kind = CAL.kind, {start, end} = calRange();
  try{
    const svc = arrFor(kind), ak = `${svc}|${start}|${end}`;
    if(CAL.src.arr && arrOn(svc) && (force || !CAL.arr[ak] || Date.now() - CAL.arr[ak].at > 15*60e3)){
      CAL.prog = `Reading the ${ARR_DEF[svc].name} calendar…`; calPaint();
      try{ CAL.arr[ak] = {at:Date.now(), ev:await calArr(svc, start, end)}; CAL.err[svc] = null; }
      catch(e){ CAL.err[svc] = e.message; }
      calPaint();
    }
    const todo = calCands(kind).filter(it => { const c = store.get(calKey(it)); return force || !c || Date.now() - c.at > 12*3600e3; });
    if(kind === 'movie' && !tmdbOn() && todo.length){
      CAL.prog = `Looking up release dates for ${todo.length} title${todo.length === 1 ? '' : 's'}…`; calPaint();
      await calMoviesWikidata(todo);
    } else {
      let n = 0;
      for(const it of todo){
        if(state.s !== 'calendar' || CAL.kind !== kind) break;
        CAL.prog = `Checking release dates… ${++n} of ${todo.length}`; if(n % 3 === 1) calPaint();
        try{ const r = kind === 'movie' ? await calMovieTmdb(it) : await calShow(it); store.set(calKey(it), {at:Date.now(), ...r, src:kind === 'movie' ? 'TMDB' : 'TVmaze'}); }
        catch(e){ if(e.net){ CAL.err.list = `Couldn't reach ${e.host}.`; break; } store.set(calKey(it), {at:Date.now(), ev:[], failed:true}); }
        await sleep(kind === 'tv' ? 350 : 120);
      }
    }
  }catch(e){ CAL.err.list = e.net ? `Couldn't reach ${e.host}.` : e.message; }
  finally{ CAL.busy = false; CAL.prog = ''; calPaint(); }
}

function calEvents(){
  const kind = CAL.kind, {start, end} = calRange(), q = fold(state.q || ''), seen = new Map();
  const push = e => {
    if(e.d < start || e.d > end || !CAL.types[e.type]) return;
    if(q && !fold(e.t).includes(q)) return;
    const k = `${fold(e.t)}|${e.type}|${e.d}|${e.sub || ''}`;
    if(seen.has(k)){ const c = seen.get(k); if(e.from) c.from = uniq([...(c.from || []), ...e.from]); return; }
    seen.set(k, e);
  };
  const svc = arrFor(kind), ak = `${svc}|${start}|${end}`;
  if(CAL.src.arr && arrOn(svc)) (CAL.arr[ak]?.ev || []).forEach(push);
  calCands(kind).forEach(it => { const c = store.get(calKey(it)); (c?.ev || []).forEach(e => push({...e, t:it.t, y:it.y, s:kind, poster:c.poster || it.poster || null, net:c.net || '', src:c.src, from:it.from, ids:it.ids})); });
  const ord = Object.keys(CTYPE);
  return [...seen.values()].sort((a, b) => a.d.localeCompare(b.d) || ord.indexOf(a.type) - ord.indexOf(b.type) || a.t.localeCompare(b.t));
}

/* ---- rendering ---- */
function calChip(e, i){
  const [label, col] = CTYPE[e.type];
  const sub = e.s === 'tv' ? [label, e.net].filter(Boolean).join(' · ') : label;
  return `<button class="cev" data-cev="${i}" style="--c:${col}" title="${esc(`${e.t}${e.y ? ` (${e.y})` : ''} — ${label}${e.sub ? ' · ' + e.sub : ''}${e.net ? ' · ' + e.net : ''}`)}"><b>${esc(e.t)}</b><small>${esc(sub)}</small></button>`;
}
function calWhere(e){ return [e.src === 'Radarr' || e.src === 'Sonarr' ? e.src : null, ...(e.from || [])].filter(Boolean); }
function calRow(e, i){
  const [label, col] = CTYPE[e.type], h = hue(e.t);
  return `<button class="crow" data-cev="${i}" style="--c:${col}">
    <span class="cpost" style="${e.poster ? `background-image:url('${esc(e.poster)}')` : `background:linear-gradient(160deg,hsl(${h} 45% 30%),hsl(${(h+40)%360} 50% 12%))`}"></span>
    <span class="cinfo"><b>${esc(e.t)}${e.y && e.s === 'movie' ? ` <em>${e.y}</em>` : ''}</b>${e.sub ? `<small>${esc(e.sub)}</small>` : ''}
      <span class="ctags"><i class="ctype">${esc(label)}</i>${e.net ? `<i>${esc(e.net)}</i>` : ''}${calWhere(e).map(w => `<i class="cwhere">${esc(w)}</i>`).join('')}${e.have ? '<i class="chave">✓ Already have it</i>' : ''}</span></span></button>`;
}
function renderCalendarSide(){
  const kind = CAL.kind, svc = arrFor(kind), D = ARR_DEF[svc];
  const chk = (grp, k, label, extra = '') => `<label class="tog cchk"><input type="checkbox" data-c${grp}="${k}" ${CAL[grp === 'src' ? 'src' : 'types'][k] ? 'checked' : ''}> ${label}${extra}</label>`;
  $('#side').innerHTML = `<h4>Calendar</h4>
    <div class="side-seg"><div class="seg"><button data-ckind="movie" class="${kind === 'movie' ? 'on' : ''}">Movies</button><button data-ckind="tv" class="${kind === 'tv' ? 'on' : ''}">TV</button></div></div>
    <h4>Show titles from</h4>
    <div class="cgroup">
      ${arrOn(svc) ? chk('src', 'arr', D.name) : `<div class="cmuted">${D.name} (not connected)</div>`}
      ${chk('src', 'lists', 'My lists')}
      ${PW.token ? chk('src', 'wl', 'Plex Watchlist') : ''}
      ${kind === 'tv' ? chk('src', 'lib', 'Shows in my library') : ''}
    </div>
    <h4>Release types</h4>
    <div class="cgroup">${CTYPES_FOR[kind].map(t => chk('type', t, CTYPE[t][0], `<i class="cdot" style="background:${CTYPE[t][1]}"></i>`)).join('')}</div>
    <div class="side-foot">${kind === 'movie'
      ? `${arrOn('radarr') ? 'Radarr supplies theatrical, digital and physical dates for its movies. ' : ''}${tmdbOn() ? `Titles from your lists use TMDB release dates for ${REGION}.` : `Titles from your lists show a single release date from Wikidata. Add a TMDB key in Settings to split them into Theatres, Streaming and Physical media.`}`
      : `Episode dates come from ${arrOn('sonarr') ? 'Sonarr and ' : ''}TVmaze, shown in your local time.`}
      ${CAL.prog ? `<div class="cprog"><span class="spin"></span>${esc(CAL.prog)}</div>` : ''}
      <button class="btn" data-crefresh>↻ Refresh</button></div>`;
}
function renderCalendar(){
  const g = $('#grid'); g.className = 'mview'; $('#sort').style.display = 'none'; $('#progress').textContent = '';
  const evs = CAL.evs = calEvents(), kind = CAL.kind, today = todayY();
  const m = calMonth(), mDate = fromYmd(m + '-01');
  $('#title').textContent = CAL.view === 'agenda' ? `Upcoming ${kind === 'movie' ? 'movies' : 'TV'}` : mDate.toLocaleDateString(undefined, {month:'long', year:'numeric'});
  $('#count').textContent = `${evs.length} release${evs.length === 1 ? '' : 's'}`;
  const errs = [CAL.err[arrFor(kind)] ? `${ARR_DEF[arrFor(kind)].name}: ${CAL.err[arrFor(kind)]}` : '', CAL.err.list, CAL.err.net].filter(Boolean);
  const bar = `<div class="ctool">
      ${CAL.view === 'month' ? `<div class="cnav"><button class="btn sm" data-cmon="-1" aria-label="Previous month">‹</button><button class="btn sm" data-cmon="0">Today</button><button class="btn sm" data-cmon="1" aria-label="Next month">›</button></div>` : ''}
      <div class="seg"><button data-cview="month" class="${CAL.view === 'month' ? 'on' : ''}">Month</button><button data-cview="agenda" class="${CAL.view === 'agenda' ? 'on' : ''}">Agenda</button></div>
      <div class="clegend">${CTYPES_FOR[kind].filter(t => CAL.types[t]).map(t => `<span><i style="background:${CTYPE[t][1]}"></i>${CTYPE[t][0]}</span>`).join('')}</div>
    </div>${errs.map(x => `<p class="aerr sm" style="margin:0 0 12px">${esc(x)}</p>`).join('')}`;
  const nothing = !arrOn(arrFor(kind)) && !calCands(kind).length;
  if(nothing){
    g.innerHTML = bar + `<div class="mpanel"><h2 class="bebas">Nothing to track yet</h2><p>The calendar shows release dates for ${kind === 'movie' ? 'movies' : 'shows'} in your <b>lists</b>${PW.token ? ', your <b>Plex Watchlist</b>' : ''} and <b>${ARR_DEF[arrFor(kind)].name}</b>. Add a few upcoming titles to a list from Discover, or connect ${ARR_DEF[arrFor(kind)].name} in Settings → Connections.</p>
      <div class="actions"><button class="btn pri" data-cgo="discover">Browse upcoming in Discover</button>${kind === 'tv' ? '<button class="btn" data-clib>Show new episodes of my shows</button>' : ''}</div></div>`;
    if(!CAL.busy && CAL.loadedFor !== `${kind}|${calRange().start}`){ CAL.loadedFor = `${kind}|${calRange().start}`; calLoad(); }
    return;
  }
  if(CAL.view === 'agenda'){
    const by = new Map(); evs.filter(e => e.d >= ymd(addDays(new Date(), -7))).forEach((e, i) => { if(!by.has(e.d)) by.set(e.d, []); by.get(e.d).push([e, evs.indexOf(e)]); });
    g.innerHTML = bar + (by.size ? [...by.entries()].map(([d, list]) => {
      const dt = fromYmd(d), rel = d === today ? 'Today' : d === ymd(addDays(new Date(), 1)) ? 'Tomorrow' : '';
      return `<div class="cday ${d < today ? 'past' : ''}"><div class="cdh"><b>${dt.toLocaleDateString(undefined, {weekday:'long', day:'numeric', month:'long'})}</b>${rel ? `<span>${rel}</span>` : ''}</div>${list.map(([e, i]) => calRow(e, i)).join('')}</div>`;
    }).join('') : `<div class="empty">${CAL.busy ? 'Checking release dates…' : 'No upcoming releases found for these filters.'}</div>`);
  } else {
    const {start} = calRange(), s = fromYmd(start), byD = new Map();
    evs.forEach((e, i) => { if(!byD.has(e.d)) byD.set(e.d, []); byD.get(e.d).push(i); });
    const days = Array.from({length:42}, (_, k) => addDays(s, k));
    const wk = Array.from({length:7}, (_, k) => addDays(s, k).toLocaleDateString(undefined, {weekday:'short'}));
    g.innerHTML = bar + `<div class="cmonth"><div class="cwk">${wk.map(w => `<span>${w}</span>`).join('')}</div><div class="cgrid">${days.map(dt => {
      const d = ymd(dt), ids = byD.get(d) || [], out = d.slice(0, 7) !== m;
      return `<div class="ccell ${out ? 'out' : ''} ${d === today ? 'today' : ''} ${d < today ? 'past' : ''}"><div class="cnum">${dt.getDate()}</div>
        ${ids.slice(0, 3).map(i => calChip(evs[i], i)).join('')}${ids.length > 3 ? `<button class="cmore" data-cday="${d}">+${ids.length - 3} more</button>` : ''}</div>`;
    }).join('')}</div></div>`;
  }
  if(!CAL.busy && CAL.loadedFor !== `${kind}|${calRange().start}`){ CAL.loadedFor = `${kind}|${calRange().start}`; calLoad(); }
}
function calOpenDay(d){
  const list = CAL.evs.map((e, i) => [e, i]).filter(([e]) => e.d === d), ov = $('#eov'), md = $('#emodal');
  md.innerHTML = `<button class="x" data-close="eov">×</button><div class="cdaypop"><h2 class="bebas">${fromYmd(d).toLocaleDateString(undefined, {weekday:'long', day:'numeric', month:'long', year:'numeric'})}</h2>${list.map(([e, i]) => calRow(e, i)).join('')}</div>`;
  ov.classList.add('open'); document.body.style.overflow = 'hidden';
}
$('#side').addEventListener('click', e => {
  if(state.s !== 'calendar') return;
  const k = e.target.closest('[data-ckind]'); if(k){ CAL.kind = k.dataset.ckind; calSave(); CAL.loadedFor = null; renderSide(); render(); return; }
  if(e.target.closest('[data-crefresh]')){ CAL.arr = {}; calLoad(true); }
});
$('#side').addEventListener('change', e => {
  if(state.s !== 'calendar') return;
  const s = e.target.dataset.csrc, t = e.target.dataset.ctype;
  if(s){ CAL.src[s] = e.target.checked; calSave(); CAL.loadedFor = null; render(); }
  if(t){ CAL.types[t] = e.target.checked; calSave(); render(); }
});
$('#grid').addEventListener('click', e => {
  if(state.s !== 'calendar') return;
  const mo = e.target.closest('[data-cmon]');
  if(mo){ const n = +mo.dataset.cmon; if(!n) CAL.month = null; else { const d = fromYmd(calMonth() + '-01'); d.setMonth(d.getMonth() + n); CAL.month = ymd(d).slice(0, 7); } render(); return; }
  const v = e.target.closest('[data-cview]'); if(v){ CAL.view = v.dataset.cview; calSave(); render(); return; }
  const go = e.target.closest('[data-cgo]'); if(go){ $(`#tabs button[data-s="${go.dataset.cgo}"]`).click(); return; }
  if(e.target.closest('[data-clib]')){ CAL.src.lib = true; calSave(); CAL.loadedFor = null; renderSide(); render(); return; }
  const day = e.target.closest('[data-cday]'); if(day){ calOpenDay(day.dataset.cday); return; }
});
document.addEventListener('click', e => {
  const c = e.target.closest('[data-cev]'); if(!c || state.s !== 'calendar') return;
  const ev = CAL.evs[+c.dataset.cev]; if(!ev) return;
  closeOv('eov');
  const own = DATA.find(d => d.s === ev.s && fold(d.t) === fold(ev.t) && (!ev.y || !d.y || Math.abs(d.y - ev.y) <= 1));
  openDetail(own || synthFromItem({k:'c:' + fold(ev.t) + (ev.y || ''), t:ev.t, y:ev.y, s:ev.s}));
});

/* ---------- Settings → Backup & Account ---------- */
function renderBackup(){
  const box = $('#backupBox'); if(!box) return;
  box.innerHTML = `<p>${YSRV ? 'Everything is saved on your YAMZ server. Download a copy, or bring in a backup — for example from the standalone YAMZ.html file.' : 'Everything is saved in this browser. Download a backup to move to another computer or to the YAMZ Docker server.'}</p>
    <div class="row" style="justify-content:flex-start;margin-top:8px"><button class="btn" data-bexport>⇩ Download backup</button><label class="btn" style="cursor:pointer">⇧ Restore backup<input type="file" accept=".json,application/json" data-bimport hidden></label></div>`;
}
document.addEventListener('click', e => {
  if(!e.target.closest('[data-bexport]')) return;
  const out = {yamz:1, at:new Date().toISOString(), data:{}};
  store.keys().filter(k => /^(zn|vault):/.test(k)).forEach(k => { const v = store.get(k); if(v != null) out.data[k] = v; });
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], {type:'application/json'}));
  a.download = `yamz-backup-${todayY()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('✓ Backup downloaded.');
});
document.addEventListener('change', async e => {
  const f = e.target.closest('[data-bimport]'); if(!f || !f.files[0]) return;
  try{
    const j = JSON.parse(await f.files[0].text()); const data = j?.data;
    if(!j?.yamz || !data || typeof data !== 'object') throw new Error('That file isn’t a YAMZ backup.');
    const keys = Object.keys(data).filter(k => /^(zn|vault):/.test(k));
    if(!keys.length) throw new Error('That backup is empty.');
    keys.forEach(k => store.set(k, data[k])); store.flush?.();
    toast(`✓ Restored ${keys.length} items — reloading…`); setTimeout(() => location.reload(), 1200);
  }catch(err){ toast(err.message || 'Couldn’t read that backup.'); }
  f.value = '';
});
let PWFORM = null;
function renderAccount(){
  const box = $('#acctBox'); if(!box) return;
  if(!YSRV){ box.innerHTML = ''; return; }
  if(YSRV.auth === 'none'){ box.innerHTML = `<h4>Account</h4><p>Sign-in is turned off on this server (YAMZ_AUTH=none). Make sure your reverse proxy protects YAMZ.</p>`; return; }
  box.innerHTML = `<h4>Account</h4>
    <div class="conn"><div class="connh"><span class="connlogo" style="font-size:24px">👤</span><div><b>${esc(YSRV.user || 'admin')}</b><small>Signed in to YAMZ ${esc(YSRV.version || '')}</small></div>
      <button class="btn sm" data-pwchange>${PWFORM ? 'Cancel' : 'Change password'}</button><button class="btn sm" data-logout>Sign out</button></div>
      ${PWFORM ? `<form class="arrform" id="pwForm" autocomplete="off" novalidate>
        <div class="field" style="grid-column:1/-1"><label>Current password</label><input type="password" name="cur" autocomplete="current-password"></div>
        <div class="field"><label>New password</label><input type="password" name="nw" autocomplete="new-password"></div>
        <div class="field"><label>Repeat new password</label><input type="password" name="nw2" autocomplete="new-password"></div>
        ${PWFORM.err ? `<p class="aerr sm">${esc(PWFORM.err)}</p>` : ''}
        <div class="row" style="margin-top:10px;justify-content:flex-start"><button class="btn pri sm" ${PWFORM.busy ? 'disabled' : ''}>${PWFORM.busy ? 'Saving…' : 'Save new password'}</button></div></form>` : ''}</div>`;
}
const api = (path, body) => fetch(path, {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json', 'X-YAMZ':'1'}, body:JSON.stringify(body || {})})
  .then(async r => { const j = await r.json().catch(() => ({})); if(!r.ok) throw new Error(j.error || 'HTTP ' + r.status); return j; });
document.addEventListener('click', async e => {
  if(e.target.closest('[data-pwchange]')){ PWFORM = PWFORM ? null : {}; return renderAccount(); }
  if(e.target.closest('[data-logout]')){ store.flush?.(); try{ await api('api/auth/logout'); }catch{} location.reload(); }
});
document.addEventListener('submit', async e => {
  if(e.target.id !== 'pwForm') return; e.preventDefault();
  const f = e.target, cur = f.cur.value, nw = f.nw.value, nw2 = f.nw2.value;
  PWFORM.err = !cur ? 'Enter your current password.' : nw.length < 8 ? 'Use at least 8 characters for the new password.' : nw !== nw2 ? "The new passwords don't match." : null;
  if(PWFORM.err) return renderAccount();
  PWFORM.busy = true; renderAccount();
  try{ await api('api/auth/password', {current:cur, password:nw}); PWFORM = null; toast('✓ Password changed. Other devices will need to sign in again.'); }
  catch(err){ PWFORM.busy = false; PWFORM.err = err.message; }
  renderAccount();
});

/* ---------- settings ---------- */
function openSettings(){
  document.querySelector(`input[name=prov][value=${cfg.prov}]`).checked = true;
  $('#key').value = cfg.key; $('#pin').value = cfg.pin || ''; $('#omdb').value = cfg.omdb || '';
  syncFields(); renderLook(); renderConn(); renderBackup(); renderAccount(); if(YSRV) document.querySelectorAll('.cachewhere').forEach(e => e.textContent = 'on your YAMZ server'); pwLoad(); ARR_SVCS.forEach(s => arrSync(s));
  $('#sov').classList.add('open'); document.body.style.overflow = 'hidden';
}
window.openSettings = openSettings;
const syncFields = () => { const v = document.querySelector('input[name=prov]:checked')?.value; $('#pinField').style.display = v==='tvdb' ? '' : 'none'; $('#key').closest('.field').style.display = v==='free' ? 'none' : ''; };
document.querySelectorAll('input[name=prov]').forEach(r => r.onchange = syncFields);
$('#saveSettings').onclick = () => {
  const prov = document.querySelector('input[name=prov]:checked').value;
  cfg = {prov, key:$('#key').value.trim(), pin:$('#pin').value.trim(), omdb:$('#omdb').value.trim()};
  store.set('vault:cfg', cfg); TVDB.token = null; store.del('vault:tvdbtok');
  mem.clear(); DATA.forEach(d => d._q = false); stopped = false; netErrs = 0; queue.length = 0;
  recomputeCats(); state.c = state.s==='missing' ? state.c : 'All'; renderSide(); setTimeout(indexAll, 300);
  closeOv('sov'); renderBanner(); render(); toast(prov!=='free' && !cfg.key ? 'No key entered, so using the free source.' : `Loading posters from ${P()===FREE ? 'Wikipedia / TVmaze' : P().name}…`);
};
$('#foldersBtn').onclick = () => { closeOv('sov'); openFolders('home'); };
$('#clearCache').onclick = () => { store.keys().filter(k => k.startsWith('vault:m:')).forEach(k => store.del(k)); mem.clear(); DATA.forEach(d => d._q = false); recomputeCats(); state.c = state.s==='missing' ? state.c : 'All'; renderSide(); render(); setTimeout(indexAll, 300); toast('Cached metadata cleared.'); };

/* ---------- events ---------- */
let tt; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 4200); }
$('#tabs').onclick = e => { const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x===b));
  state.s = b.dataset.s; state.c = state.s==='missing' ? missDefault() : state.s==='discover' ? DISC.sec : 'All'; if(state.s==='lists'){ state.attn = false; pwLoad(); } state.q = ''; $('#q').value = ''; renderSide(); render(); scrollTo(0,0); };
$('#side').addEventListener('click', e => {
  if(state.s !== 'discover') return;
  const k = e.target.closest('[data-dkind]'); if(k){ DISC.kind = k.dataset.dkind; store.set('zn:dkind', DISC.kind); renderSide(); render(); loadDiscover(); }
  if(e.target.closest('[data-drefresh]')) loadDiscover(true);
});
$('#side').onclick = e => { if(e.target.closest('[data-act=scan]')) return runScan(); if(e.target.closest('[data-act=tvcheck]')) return tvCheck(); const b = e.target.closest('.cat'); if(!b) return;
  state.c = b.dataset.c; state.q = ''; $('#q').value = ''; MISS.filter = ''; if(state.s==='discover'){ DISC.sec = state.c; store.set('zn:dsec', DISC.sec); } renderSide(); render(); scrollTo(0,0); $('#side').classList.remove('open'); };
let qt; $('#q').oninput = e => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value; renderSide(); render(); }, 180); };
$('#sort').onchange = e => { state.sort = e.target.value; render(); };
$('#attnBtn').onclick = () => { state.attn = !state.attn; render(); scrollTo(0,0); };
$('#grid').onclick = e => {
  const dl = e.target.closest('[data-adddisc]'); if(dl){ e.stopPropagation(); const x = DMAP.get(dl.dataset.adddisc); if(x) openListPop(dl, itemOf(synth(x))); return; }
  const dc = e.target.closest('.dcard'); if(dc){ const x = DMAP.get(dc.dataset.q); if(x) openDetail(synth(x)); return; }
  if(e.target.closest('[data-drefresh]')) return loadDiscover(true);
  const lb = e.target.closest('[data-addlist]'); if(lb){ e.stopPropagation(); const d = DATA[lb.dataset.addlist]; if(d) openListPop(lb, itemOf(d)); return; }
  const xr = e.target.closest('[data-lrm]'); if(xr){ e.stopPropagation(); removeFromList(state.c, xr.dataset.lrm); return; }
  const wc = e.target.closest('.wcard'); if(wc){ const it = PW.items.find(i => i.rk === wc.dataset.wk); if(it) openDetail(synthFromItem({k:'p'+it.rk, t:it.t, y:it.y, s:it.s})); return; }
  const xc = e.target.closest('.xcard'); if(xc){ const it = curList()?.items.find(i => i.k === xc.dataset.lk); if(it) openDetail(synthFromItem(it)); return; }
  const mi = e.target.closest('.mini'); if(mi) return openDetail(synth(MINI.get(mi.dataset.q)));
  const c = e.target.closest('.card'); if(c) return openDetail(DATA[c.dataset.i]);
  if(e.target.closest('[data-act=scan]')) return runScan();
  if(e.target.closest('[data-act=tvcheck]')) return tvCheck();
  if(e.target.closest('[data-act=folders]')) return openFolders('home');
  if(e.target.closest('[data-act=folders-tv]')) return openFolders('home');
  const tvo = e.target.closest('[data-open]'); if(tvo){ const d = DATA[tvo.dataset.open]; if(d) openDetail(d); }
};
$('#grid').oninput = e => { if(e.target.id==='mfilter'){ MISS.filter = e.target.value; applyFilter(); } };
$('#grid').onchange = e => { if(e.target.id==='kidsTog'){ MISS.kids = e.target.checked; store.set('zn:kids', MISS.kids); render(); } if(e.target.id==='realTog'){ TV.real = e.target.checked; store.set('zn:real', TV.real); renderSide(); render(); } if(e.target.id==='ownTog'){ MISS.showOwn = e.target.checked; store.set('zn:own', MISS.showOwn); render(); } };
$('#settingsBtn').onclick = openSettings;
$('#menuBtn').onclick = () => $('#side').classList.toggle('open');
$('#surprise').onclick = () => { const pool = state.s==='missing' ? DATA.filter(d => d.s==='movie') : visible(); if(pool.length) openDetail(pool[Math.floor(Math.random()*pool.length)]); };
document.addEventListener('click', e => {
  const x = e.target.closest('[data-close]'); if(x) return closeOv(x.dataset.close);
  if(e.target.classList.contains('ov')) return closeOv(e.target.id);
  const g = e.target.closest('.gallery img'); if(g){ $('#lb img').src = g.dataset.full; $('#lb').classList.add('open'); }
});
document.addEventListener('click', e => { const s = $('#side'); if(s.classList.contains('open') && !s.contains(e.target) && !e.target.closest('#menuBtn')) s.classList.remove('open'); });
$('#lb').onclick = () => $('#lb').classList.remove('open');
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if($('#lb').classList.contains('open')) return $('#lb').classList.remove('open');
  if($('#lpop').classList.contains('open')) return closeListPop();
  if($('#eov').classList.contains('open')) return closeOv('eov');
  if($('#fov').classList.contains('open')) return closeOv('fov');
  if($('#aov').classList.contains('open')){ ADD = null; return closeOv('aov'); }
  ['ov','sov'].forEach(id => $('#'+id).classList.contains('open') && closeOv(id));
});

buildData();
renderSide(); renderBanner(); render();
if(!LIB.movies.length && !LIB.tv.length && !LIB.servers.length && !store.get('zn:setup')) openFolders('home');
setTimeout(() => pwLoad(), 2500);
setTimeout(() => ARR_SVCS.forEach(s => arrSync(s)), 3200);
if(LIB.servers.length && !inPreview && LIB.servers.some(s => Date.now() - (s.at||0) > 30*60e3)) setTimeout(() => syncAll(true).then(() => toast('✓ Library synced with your server.')), 1500);
</script>
</body>
</html>
