<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YAMZ · Live demo</title>
<meta name="description" content="Try YAMZ — Yet Another Media Zombie — in your browser with a sample library. Nothing to install.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0c0d10">
<style>
  html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% -10%,#1c1830 0%,#0c0d10 60%);color:#ecebe6;font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
  img{width:110px;height:110px;filter:drop-shadow(0 0 22px rgba(148,195,92,.45));animation:bob 2.4s ease-in-out infinite alternate}
  @keyframes bob{to{transform:translateY(-8px) rotate(3deg)}}
  h1{margin:14px 0 0;font:400 56px/1 "Bebas Neue",Impact,"Arial Narrow",sans-serif;letter-spacing:.04em;color:#e8b04b}
  h1 span{color:#94c35c}
  p{color:#9b9890;margin:8px 0 0}
  .err{color:#e07a6e;max-width:440px}
  a{color:#94c35c}
</style>
</head>
<body>
<main><div><img src="icon.svg" alt=""><h1>YAM<span>Z</span></h1><p id="msg">Waking the zombie… starting the live demo.</p></div></main>
<script>
  const msg = t => { document.getElementById('msg').innerHTML = t; };
  (async () => {
    if(!('serviceWorker' in navigator)) return msg('<span class="err">This browser can’t run the demo (no service worker support). Try a recent Chrome, Edge, Firefox or Safari — and not a private window in Firefox.</span>');
    try{
      await navigator.serviceWorker.register('sw.js', {scope:'./'});
      await navigator.serviceWorker.ready;
      if(!navigator.serviceWorker.controller){
        await new Promise(r => { navigator.serviceWorker.addEventListener('controllerchange', r, {once:true}); setTimeout(r, 3000); });
      }
      if(!navigator.serviceWorker.controller) return location.reload();
      location.replace('app.html' + location.hash);
    }catch(e){ msg('<span class="err">Couldn’t start the demo: ' + (e.message || e) + '</span><br><a href="">Try again</a>'); }
  })();
</script>
</body>
</html>
